      yield 30;
    }
    // 強く吸い込む。画面の端から星が中心へ飛んでくる
    function* inhale() {
      W.say('スゥゥゥ……', 0, 0, 50, { follow: h, dy: -12 });

      pullBase = phase2() ? 1.0 : 0.9;
      for (let t = 0; t < 130; t++) {
        if (t % 11 === 0) {
          const side = rng.chance(0.5) ? -1 : 1;
          const y = rng.range(150, 236);
          const x = side < 0 ? -8 : 488;
          const dx = h.cx - x,
            dy = h.cy - y;
          const d = Math.hypot(dx, dy);
          debris(x, y, (dx / d) * 2.2, (dy / d) * 2.2, 'star', '吸い込まれる星にぶつかった。');

    // 吐き出し：星の輪（輪ごとに隙間がずれる）

        h.size = 1;

          off = (w % 2) * (Math.PI / n);

          const a = off + (i / n) * Math.PI * 2;
          debris(h.cx, h.cy, Math.cos(a) * 1.8, Math.sin(a) * 1.8, 'star', '吐き出された星に当たった。');
        }
        G.sfx('explode');
        yield 40;
      }
    }
    // 降着円盤：周りを回る星の輪が広がり、一斉に飛び散る
    function* disk() {
      G.sfx('charge');
      const n = phase2() ? 18 : 14;
      const ring = [];
      for (let i = 0; i < n; i++) {
        const f = W.fruit(h.cx, h.cy, { kind: 'star', r: 4, keep: true, cause: '降着円盤に巻きこまれた。' });

      for (let t = 0; t < 90; t++) {

      let last = '';
      for (;;) {

        let p;

        else if (p === 'jets') yield* jets();

          ['cherry', 6, '吐き出されたリンゴに当たった。'], ['cherry', 6, '吐き出されたリンゴに当たった。'], ['rock', 8, '吐き出された岩に当たった。'],
          ['needle', 4, '吐き出されたサボテンの針。'], ['cherry', 6, '吐き出されたリンゴに当たった。'],
        ];

      for (let i = 0; i < n; i++) xs.push(rng.range(24, 380));

      G.sfx('warn');

    // 根っこの波（床か天井を走る）
    function* roots() {
      t.face = 'angry';
      W.shake = 14;
      G.sfx('rumble');
      yield 26;
      const g = W.gravity;
      for (let tx = 18; tx >= 1; tx--) {
        const s = W.spike(tx, g > 0 ? 11 : 1, g > 0 ? 'u' : 'd', { hidden: true, cause: '根っこにつまずいた。', pal: 'dark' });
        s.bossShot = true;
        s.pop(3, false);
        W.after(22, () => (s.alive = false));
        if (tx % 2 === 0) G.sfx('pop');
        yield phase() === 3 ? 4 : 5;
      }
      t.face = 'calm';
      yield 30;
    }
    // 葉っぱの嵐：左向きの風と葉っぱ
    function* leaves() {
      t.face = 'grin';
      W.say('葉っぱカッター！', 0, 0, 50, { follow: t, dy: -6 });
      W.windX = -0.7;
      for (let k = 0; k < 150; k++) {
        if (k % 7 === 0) {
          const y = rng.range(30, 236);
          const lf = W.fruit(480, y, { kind: 'leaf', r: 4, cause: '葉っぱで切れた。' });
          lf.base = y;
          lf.vel(-2.6, 0);
          lf.bossShot = true;
          lf.tick = function () {
            this.y = this.base + Math.sin(this.t * 0.12) * 10 - this.r;
          };
        }
        yield 1;
      }
      W.windX = 0;
      yield 30;
    }
    // 果実の扇：枝からこちらを狙って扇状にリンゴを投げる
    function* fan() {
      t.face = 'grin';
      for (let v = 0; v < (phase() === 3 ? 3 : 2); v++) {
        G.sfx('charge');
        yield 20;
        const sx = t.cx - 50,
          sy = t.y + 50;
        const a0 = Math.atan2(P.cy - sy, P.cx - sx);
        const n = 5;
        for (let i = 0; i < n; i++) {
          const a = a0 + (i - (n - 1) / 2) * 0.2;
          const f = apple(sx, sy, 5, '扇状のリンゴに当たった。');
          f.vel(Math.cos(a) * 2, Math.sin(a) * 2 - 0.4, 0, 0.014 * W.gravity);
        }
        G.sfx('shoot');
        yield 40;
      }
      t.face = 'calm';
      yield 20;
    }
    // 種マシンガン：狙い撃ちの種を連射
    function* seeds() {
      t.face = 'angry';
      W.say('タネマシンガン！', 0, 0, 40, { follow: t, dy: -6 });
      yield 24;
      for (let k = 0; k < (phase() === 3 ? 36 : 26); k++) {
        const sx = t.cx - 20,
          sy = t.y + 110;
        const a = Math.atan2(P.cy - sy, P.cx - sx) + rng.range(-0.12, 0.12);
        const f = W.fruit(sx, sy, { kind: 'seed', r: 3, cause: '種マシンガンに撃ち抜かれた。' });
        f.vel(Math.cos(a) * 3.4, Math.sin(a) * 3.4);
        f.bossShot = true;
        if (k % 3 === 0) G.sfx('shoot');
        yield 4;
      }
      t.face = 'calm';
      yield 30;
    }
    // 引力反転：しばらく上下がさかさまになる
    function* flip() {
      W.say('引力、反転！', 0, 0, 60, { follow: t, dy: -6 });
      G.sfx('charge');
      W.flash = 6;
      W.flashColor = '#c58cff';
      yield 40;
      W.gravity = -1;
      P.vy *= 0.3;
      P.djump = true;
      G.sfx('flip');
      yield 40;
      yield* rain();
      yield* roots();
      if (phase() === 3) yield* seeds();
      W.say('……戻れ！', 0, 0, 40, { follow: t, dy: -6 });
      G.sfx('charge');
      yield 30;
      W.gravity = 1;
      P.vy *= 0.3;
      P.djump = true;
      G.sfx('flip');
      yield 40;
    }
    // 大きなリンゴが転がってくる（後半）
    function* bigApple() {
      t.face = 'rage';
      G.sfx('warn');
      yield 24;
      for (let k = 0; k < 2; k++) {
        const a = apple(t.cx - 40, 240 - 20, 20, '大きなリンゴに轢かれた。');
        a.vel(-3 - k * 0.6, 0);
        a.offscreenKill = 60;
        G.sfx('rumble');
        // 転がりながら小さなリンゴを撒く
        a.tick = function () {
          G.Fruit.prototype.tick.call(this);
          if (this.t % 20 === 0) {
            const b = apple(this.cx, this.cy - 16, 4, '大きなリンゴから小さなリンゴ。');
            b.vel(0.4, -3.2, 0, 0.14);
          }
        };
        yield 70;
      }
      yield 30;
      t.face = 'calm';
    }
    // 最後のあがき：根ごと跳んでくる
    function* desperation() {
      t.vulnerable = false;
      t.face = 'rage';
      W.say('リンゴは……落ちるものだ！', 0, 0, 80, { follow: t, dy: -6 });
      W.shake = 30;
      G.sfx('roar');
      yield 60;
      t.vulnerable = true;
      for (let k = 0; k < 2; k++) {
        const tx = k === 0 ? 220 : 418;
        const dur = 56;
        t.vel((tx - t.cx) / dur, -5.6, 0, 0.2);
        G.sfx('boing');
        yield () => t.vy > 0 && t.y + t.h >= 240;
        t.stop();
        t.y = 240 - t.h;
        W.shake = 20;
        G.sfx('stomp');
        for (const d of [-1, 1]) {
          const wv = W.hbox(t.cx + d * 30 - 6, 230, 12, 10, { kind: 'wave', cause: '樹の着地に足をすくわれた。' });
          wv.vel(d * 2.6, 0);
        }
        yield 60;
      }
      t.face = 'calm';
    }

    W.run(function* () {
      const quick = opts.respawn && W.game && W.game.flags.treeSeen;
      yield () => P.alive && P.onGround && P.y + P.h <= 240;
      W.sealFloor && W.sealFloor();
      G.music(null);
      if (!quick) {
        W.say('よくぞ来た。わしがニュートンの樹じゃ。', 0, 0, 100, { follow: t, dy: -6 });
        yield 100;
        W.say(`ここまでに ${deaths} 回、リンゴやトゲに倒れたな。`, 0, 0, 100, { follow: t, dy: -6 });
        yield 100;
        t.face = 'grin';
        W.say('すべてのリンゴは、わしから落ちる。\n最後のリンゴを受けてみよ！', 0, 0, 110, { follow: t, dy: -6 });
        yield 100;
      } else {
        t.face = 'grin';
        W.say(`また落ちてきたか。${deaths} 回目じゃ。`, 0, 0, 60, { follow: t, dy: -6 });
        yield 50;
      }
      if (W.game) W.game.flags.treeSeen = true;
      G.sfx('roar');
      W.shake = 30;
      G.music('last');
      t.showBar = true;
      t.hazard = true;
      t.vulnerable = true;
      W.autoFire = true;
      if (W.easy) W.lives = 3;
      let lastPhase = 1,
        desp = false,
        last = '';
      for (;;) {
        const ph = phase();
        if (ph !== lastPhase) {
          lastPhase = ph;
          G.sfx('roar');
          W.shake = 24;
          W.flash = 8;
          W.flashColor = '#c0ff90';
          W.say(ph === 2 ? 'ほう、やるのう。' : '万有引力の本気を見せてやろう！', 0, 0, 70, { follow: t, dy: -6 });
          yield 60;
        }
        if (!desp && t.hp < t.maxHp * 0.1) {
          desp = true;
          yield* desperation();
          continue;
        }
        const pool = ph === 1 ? ['rain', 'roots', 'leaves', 'fan'] : ph === 2 ? ['rain', 'roots', 'leaves', 'flip', 'fan', 'seeds'] : ['rain', 'roots', 'flip', 'big', 'leaves', 'fan', 'seeds'];
        let p;
        do p = rng.pick(pool);
        while (p === last);
        last = p;
        if (p === 'fan') yield* fan();
        else if (p === 'seeds') yield* seeds();
        else if (p === 'rain') yield* rain();
        else if (p === 'roots') yield* roots();
        else if (p === 'leaves') yield* leaves();
        else if (p === 'flip') yield* flip();
        else yield* bigApple();
        yield ph === 1 ? 16 : 10;
      }
    }, t.ai);

    t.onDefeat = () => {
      G.music(null);
      W.autoFire = false;
      W.god = true;
      markDead(W, 'treeDead', 5, 11);
      W.lives = null;
      W.invuln = 0;
      W.windX = 0;
      W.gravity = 1;
      clearShots(W, t);
      W.run(function* () {
        t.face = 'hurt';
        for (let i = 0; i < 80; i++) {
          t.shakeX = i % 2 ? 2 : -2;
          if (i % 8 === 0) {
            W.burst(t.cx + rng.range(-40, 40), t.y + rng.range(10, 100), 16, ['#3a8a3a', '#7ad05a', '#ff3355'], 2.5, { g: 0.08 });
            G.sfx('explode');
          }
          yield 1;
        }
        t.shakeX = 0;
        t.showBar = false;
        W.say('見事じゃ……', 0, 0, 60, { follow: t, dy: -6 });
        yield 50;
        // 樹が倒れる
        for (let i = 1; i <= 40; i++) {
          t.rot = (i / 40) * (Math.PI / 2) * (i / 40);
          yield 1;
        }
        W.shake = 30;
        G.sfx('bigexplode');
        W.burst(t.cx + 60, 236, 80, ['#3a8a3a', '#7ad05a', '#8a5a2a', '#ff3355'], 4, { up: 2, g: 0.12, life: 60 });
        yield 60;
        // 最後のリンゴが頭に落ちてきて……
        const last = W.fruit(P.cx, -10, { r: 6, kind: 'gold', keep: true });
        last.hazard = false;
        last.vel(0, 2, 0, 0.15);
        yield () => last.cy >= P.y - 4;
        last.vel(P.face > 0 ? -1.4 : 1.4, -3, 0, 0.2);
        G.sfx('bonk');
        W.say('コツン', P.cx, P.y - 6, 50, { plain: true, size: 10, color: '#ffffff' });
        yield 50;
        W.say('ひらめいた！', P.cx, P.y - 10, 90, {});
        G.sfx('fanfare');
        W.text(240, 80, 'ニュートンの樹 をたおした！', { size: 15, color: '#ffe9a8' });
        W.text(240, 104, 'リンゴは、下に落ちるものだった。', { size: 11, color: '#e8e2ff' });
        if (W.game) W.game.flags.treeDead = true;
        yield 220;
        if (W.game && W.game.stageClear) W.game.stageClear();
      });
    };
    return t;
  };
})();

</script>
<script>
// 4面のボス：THE SAVE POINT（すべての黒幕）と、まさかの結末
(function () {
  'use strict';
  const G = globalThis.G;
  const SW = G.W;
  const FLOOR = 240;

  class SaveBoss extends G.Boss {
    constructor(W, cx, cy) {
      super(W, cx - 30, cy - 30, 60, 60, { hp: 150, name: 'THE SAVE POINT' });
      this.face = 'grin';
      this.cause = 'セーブポイントにぶつかった。セーブはされなかった。';
      this.glitch = 0;
    }
    hits(rect) {
      return this.hazard && G.overlap(rect, { x: this.x + 6, y: this.y + 6, w: this.w - 12, h: this.h - 12 });
    }
    // 足場の上から撃った弾が届くよう、下に少し広い
    shotBox() {
      return { x: this.x - 4, y: this.y - 4, w: this.w + 8, h: this.h + 32 };
    }
    tick() {
      super.tick();
      if (this.glitch > 0) this.glitch--;
    }
    draw(ctx) {
      G.Render.drawSaveBoss(ctx, this);
    }
  }
  G.SaveBoss = SaveBoss;

  G.BOSSES.savepoint = function (W, opts) {
    const P = W.player;
    const rng = W.rng;
    const HOMEY = 112;
    const b = W.add(new SaveBoss(W, 240, -60));
    const phase2 = () => b.hp < b.maxHp / 2;
    const deaths = (W.game && W.game.deaths) || 0;
    const shot = (x, y, kind, r, cause) => {
      const f = W.fruit(x, y, { kind, r, cause });
      f.bossShot = true;
      return f;
    };
    function* goTo(cx, cy, d, ease) {
      b.tweenTo(cx - 30, cy - 30, d, ease || 'inOutQuad');
      yield d;
    }
    // ミニセーブポイントの雨（▼の場所に落ちる）
    function* shower() {
      const n = phase2() ? 8 : 6;
      const xs = [];
      for (let i = 0; i < n; i++) xs.push(rng.range(30, 450));
      const marks = xs.map((x) => W.text(x, 30, '▼', { size: 9, color: '#9affc0' }));
      G.sfx('warn');
      yield 40;
      marks.forEach((m) => (m.alive = false));
      for (let i = 0; i < n; i++) {
        const f = shot(xs[i], -10, 'minisave', 7, 'ミニセーブポイントに押しつぶされた。');
        f.vel(0, 2, 0, 0.08);
        f.maxV = 4;
        if (i % 2) yield 6;
      }
      yield 50;
    }
    // 上書き保存：プレイヤーのいる高さを横一直線に
    function* overwrite() {
      const onPlat = P.y < 190;
      const y = onPlat ? 146 : 222;
      W.say('上書き保存します', 0, 0, 40, { follow: b, dy: -4 });
      W.laser(0, y - 2, 480, 16, { warn: 46, dur: 22, cause: '上書き保存された。', color: '#9affc0' });
      G.sfx('charge');
      yield 74;
      if (phase2()) {
        W.laser(0, onPlat ? 220 : 144, 480, 16, { warn: 40, dur: 22, cause: '上書き保存された。', color: '#9affc0' });
        G.sfx('charge');
        yield 66;
      }
    }
    // オートセーブ：S の輪（輪ごとに隙間がずれる）
    function* autosave() {
      yield* goTo(240, HOMEY, 30);
      for (let w = 0; w < (phase2() ? 3 : 2); w++) {
        G.sfx('charge');
        yield 22;
        const n = 12,
          off = (w % 2) * (Math.PI / n);
        for (let i = 0; i < n; i++) {
          const a = off + (i / n) * Math.PI * 2;
          const f = shot(b.cx, b.cy, 'sbullet', 5, 'オートセーブに巻きこまれた。');
          f.vel(Math.cos(a) * 1.5, Math.sin(a) * 1.5);
        }
        G.sfx('explode');
        yield 40;
      }
    }
    // ロード：消えて別の場所に現れる。残った影が弾ける（後半）
    function* load() {
      const ox = b.cx,
        oy = b.cy;
      b.visible = false;
      b.hazard = false;
      W.say('ロード中……', ox, oy - 34, 40, { plain: true, size: 10, color: '#9affc0' });
      G.sfx('reveal');
      yield 30;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const f = shot(ox, oy, 'sbullet', 5, 'ロードに失敗した。');
        f.vel(Math.cos(a) * 1.6, Math.sin(a) * 1.6);
      }
      G.sfx('explode');
      const nx = P.cx < 240 ? rng.range(300, 400) : rng.range(80, 180);
      b.x = nx - 30;
      b.y = HOMEY - 30;
      b.visible = true;
      b.hazard = true;
      yield 40;
    }
    // データ破損：画面がちらつき、ERR が飛んでくる（後半）
    function* corrupt() {
      W.say('データが破損しています', 0, 0, 50, { follow: b, dy: -4 });
      for (let v = 0; v < 3; v++) {
        b.glitch = 20;
        W.flash = 4;
        W.flashColor = '#9affc0';
        G.sfx('scratch');
        yield 20;
        const a0 = Math.atan2(P.cy - b.cy, P.cx - b.cx);
        for (const da of [-0.25, 0, 0.25]) {
          const f = shot(b.cx, b.cy, 'err', 6, 'ERROR：あなたは死にました。');
          f.vel(Math.cos(a0 + da) * 2, Math.sin(a0 + da) * 2);
        }
        yield 30;
      }
    }
    function* drift() {
      yield* goTo(G.clamp(P.cx + rng.range(-110, 110), 90, 390), HOMEY + rng.range(-6, 4), 46);
    }

    W.run(function* () {
      const quick = opts.respawn && W.game && W.game.flags.saveBossSeen;
      yield () => P.alive && P.onGround;
      G.music(null);
      // 小さな月が待っている
      const moon = W.add(new G.Moon(W, 240, 90, { r: 14, hazard: false, keep: true, face: 'calm' }));
      if (!quick) {
        yield 30;
        W.say('やあ。ぼくは月。', moon.cx, moon.y - 6, 80, {});
        yield 80;
        W.say('リンゴを落としていたのは、ぼくじゃない。', moon.cx, moon.y - 6, 90, {});
        yield 90;
        W.say(`きみが ${deaths} 回死ぬたびに\n同じ場所へ戻していた"あいつ"がいる。`, moon.cx, moon.y - 6, 110, {});
        yield 110;
        moon.face = 'shock';
        W.say('……来た！', moon.cx, moon.y - 6, 50, {});
        yield 40;
      }
      moon.tweenTo(30, 30, 30, 'outQuad');
      yield* goTo(240, HOMEY, 50, 'outBounce');
      W.shake = 20;
      G.sfx('stomp');
      if (!quick) {
        W.say('そう、私だ。セーブポイントだ！', 0, 0, 90, { follow: b, dy: -4 });
        yield 90;
        W.say('何度でもやり直させ、何度でも死なせる。\nそれが私の楽しみだったのだ！', 0, 0, 110, { follow: b, dy: -4 });
        yield 100;
      } else {
        W.say(`おかえり。${deaths} 回目のやり直しだ。`, 0, 0, 60, { follow: b, dy: -4 });
        yield 50;
      }
      if (W.game) W.game.flags.saveBossSeen = true;
      G.sfx('roar');
      W.shake = 30;
      G.music('last');
      b.showBar = true;
      b.hazard = true;
      b.vulnerable = true;
      W.autoFire = true;
      if (W.easy) W.lives = 3;
      let last = '';
      for (;;) {
        const pool = phase2() ? ['shower', 'overwrite', 'autosave', 'load', 'corrupt'] : ['shower', 'overwrite', 'autosave'];
        let p;
        do p = rng.pick(pool);
        while (p === last);
        last = p;
        if (p === 'shower') yield* shower();
        else if (p === 'overwrite') yield* overwrite();
        else if (p === 'autosave') yield* autosave();
        else if (p === 'load') yield* load();
        else yield* corrupt();
        if (p !== 'load') yield* drift();
        yield phase2() ? 14 : 22;
      }
    }, b.ai);

    b.onDefeat = () => {
      G.music(null);
      W.autoFire = false;
      W.god = true;
      W.lives = null;
      W.invuln = 0;
      G.BOSSES.clearShots(W, b);
      G.BOSSES.markDead(W, 'saveBossDead', 2, 11);
      W.run(function* () {
        b.visible = true;
        b.face = 'hurt';
        b.tweenTo(240 - 30, 100 - 30, 30, 'outQuad');
        yield 30;
        W.say('セーブデータを……\n道連れにしてやる……！', 0, 0, 90, { follow: b, dy: -4 });
        for (let i = 0; i < 90; i++) {
          b.shakeX = i % 2 ? 2 : -2;
          b.glitch = 4;
          yield 1;
        }
        W.burst(b.cx, b.cy, 120, ['#9affc0', '#ffffff', '#3a8a5a'], 5, { g: 0.08, life: 60 });
        G.sfx('bigexplode');
        W.flash = 20;
        W.shake = 30;
        b.alive = false;
        b.visible = false;
        b.showBar = false;
        yield 40;
        // 偽のセーブデータ消去画面
        W.vars.fakeDeleteText = 'セーブデータを消去しています……';
        for (let i = 0; i <= 100; i++) {
          W.vars.fakeDelete = i;
          if (i % 10 === 0) G.sfx('select');
          yield i > 90 ? 6 : 2;
        }
        W.vars.fakeDeleteText = 'セーブデータを消去しました。';
        G.sfx('scratch');
        yield 90;
        W.vars.fakeDeleteText = '……というのはウソ。';
        yield 90;
        W.vars.fakeDelete = null;
        W.god = !!G.god;
        yield 20;
        yield* G.BOSSES.truthEnding(W);
      });
    };
    return b;
  };

  // まさかの結末：月と仲直り……したと思ったら
  G.BOSSES.truthEnding = function* (W) {
    const P = W.player;
    G.music('ending');
    let moon = W.ents.find((e) => e instanceof G.Moon && e.alive);
    if (!moon) moon = W.add(new G.Moon(W, 240, -30, { r: 14, hazard: false, keep: true, face: 'calm' }));
    moon.hazard = false;
    moon.tweenTo(240 - moon.r, 80 - moon.r, 50, 'outQuad');
    yield 60;
    moon.face = 'calm';
    W.say('ありがとう。', moon.cx, moon.y - 6, 70, {});
    yield 70;
    W.say('これからは仲良くしよう。\nもう二度と、落ちたりしないよ。', moon.cx, moon.y - 6, 120, {});
    yield 120;
    moon.face = 'shock';
    W.say('……あっ。', moon.cx, moon.y - 6, 40, {});
    yield 30;
    // うっかり落ちてくる（どこへ逃げても追いかけてくる）
    for (let i = 0; i < 26; i++) {
      moon.x += (P.cx - moon.cx) * 0.25;
      moon.y += 4 + i * 0.6;
      yield 1;
      if (moon.cy >= P.y) break;
    }
    W.shake = 30;
    W.flash = 20;
    W.flashColor = '#ffffff';
    G.sfx('thud');
    P.alive = false;
    W.burst(P.cx, P.cy, 30, ['#fffbe0', '#ff3355', '#ffffff'], 3, { g: 0.1 });
    W.say('ゴメン', moon.cx, moon.y - 8, 90, {});
    yield 100;
    if (W.game) {
      if (W.game.stageClear) W.game.stageClear();
    }
  };
})();

</script>
<script>
// 6面のボス：THE TRUE MOON（連続プレイヤー殺人事件の真犯人）と、ほんとうの結末
(function () {
  'use strict';
  const G = globalThis.G;
  const FLOOR = 240;
  const talk = (W, who, text, d) => W.say(text, 0, 0, d || 100, { follow: who, dy: -4 });

  class TrueMoon extends G.MoonBoss {
    constructor(W, cx, cy) {
      super(W, cx, cy, 280);
      this.name = 'THE TRUE MOON';
      this.cause = '真犯人に触れてしまった。';
      this.visible = false;
    }
  }
  G.TrueMoon = TrueMoon;

  G.BOSSES.trueMoon = function (W, opts, quick, npc) {
    const P = W.player;
    const rng = W.rng;
    const HOMEY = 100;
    const m = W.add(new TrueMoon(W, npc ? npc.cx : 240, npc ? npc.cy : -60));
    const phase2 = () => m.hp < m.maxHp / 2;
    const deaths = (W.game && W.game.deaths) || 0;
    const shot = (x, y, kind, r, cause) => {
      const f = W.fruit(x, y, { kind, r, cause });
      f.bossShot = true;
      return f;
    };
    function* goTo(cx, cy, d, ease) {
      m.tweenTo(cx - m.r, cy - m.r, d, ease || 'inOutQuad');
      yield d;
    }
    function* drift() {
      yield* goTo(G.clamp(P.cx + rng.range(-110, 110), 90, 390), HOMEY + rng.range(-6, 4), phase2() ? 34 : 44);
    }
    // ウソの予告：予告した場所「以外」を焼く（予告された場所だけが安全）
    let lies = 0;
    function* lieLaser() {
      const safeX = G.clamp(P.cx + rng.range(-80, 80), 40, 440);
      const L = safeX - 30,
        Rr = safeX + 30;
      W.vars.fakeWarn = { x: L, w: 60 };
      if (lies++ === 0) talk(W, m, 'ここを撃つよ。予告どおりにね！', 60);
      G.sfx('charge');
      yield phase2() ? 44 : 54;
      W.vars.fakeWarn = null;
      const cause = '月の予告は、ウソだった。';
      for (let x = 0; x < L; x += 40) W.laser(x, 0, Math.min(40, L - x), FLOOR, { warn: 6, dur: 22, cause, color: '#ffe9a8' });
      for (let x = Rr; x < G.W; x += 40) W.laser(x, 0, Math.min(40, G.W - x), FLOOR, { warn: 6, dur: 22, cause, color: '#ffe9a8' });
      yield 36;
    }
    // 満ち欠け：三日月の弾がらせんに
    function* phases() {
      yield* goTo(240, HOMEY, 30);
      const n = phase2() ? 36 : 26;
      const sp = phase2() ? 1.8 : 1.5;
      for (let w = 0; w < n; w++) {
        const a = w * 0.43;
        for (let k = 0; k < 2; k++) {
          const aa = a + k * Math.PI;
          const f = shot(m.cx, m.cy, 'crescent', 5, '月の満ち欠けに巻きこまれた。');
          f.vel(Math.cos(aa) * sp, Math.sin(aa) * sp);
        }
        yield 5;
      }
      yield 30;
    }
    // リンゴの雨（すべては、ここから始まった）
    function* apples() {
      const n = phase2() ? 9 : 7;
      const xs = [];
      for (let i = 0; i < n; i++) xs.push(20 + ((i + rng.range(0, 0.8)) / n) * 440);
      const marks = xs.map((x) => W.text(x, 30, '▼', { size: 9, color: '#ff6a8a' }));
      G.sfx('warn');
      yield 36;
      marks.forEach((t) => (t.alive = false));
      for (let i = 0; i < n; i++) {
        const f = shot(xs[i], -10, 'cherry', 6, '最初の死因と、同じだった。');
        f.vel(0, 1.5, 0, 0.12);
        f.maxV = 4.5;
        if (i % 2) yield 5;
      }
      yield 60;
    }
    // 月落とし（1面の、あの月）
    let slams = 0;
    function* slam() {
      const x = G.clamp(P.cx, 60, 420);
      yield* goTo(x, HOMEY - 20, 26);
      if (slams++ === 0) talk(W, m, '落ちてあげる。', 40);
      W.vars.shadowX = x;
      G.sfx('warn');
      yield phase2() ? 18 : 26;
      m.tweenTo(x - m.r, FLOOR - m.r * 2, 16, 'inQuad');
      yield 16;
      W.vars.shadowX = null;
      W.shake = 20;
      G.sfx('stomp');
      for (const d of [-1, 1]) {
        const f = shot(x + d * (m.r + 4), 233, 'star', 6, '月落としの衝撃波。');
        f.vel(d * 2.3, 0);
      }
      yield 30;
      yield* goTo(x, HOMEY, 36);
    }
    // ミニセーブポイントの雨（4面の黒幕も、ぼくが作った）
    function* saves() {
      talk(W, m, 'セーブポイントも、ぼくが作ったんだ。', 70);
      const xs = [];
      for (let i = 0; i < 7; i++) xs.push(rng.range(30, 450));
      const marks = xs.map((x) => W.text(x, 30, '▼', { size: 9, color: '#9affc0' }));
      G.sfx('warn');
      yield 40;
      marks.forEach((t) => (t.alive = false));
      for (let i = 0; i < xs.length; i++) {
        const f = shot(xs[i], -10, 'minisave', 7, 'ミニセーブポイントに押しつぶされた。');
        f.vel(0, 2, 0, 0.08);
        f.maxV = 4;
        if (i % 2) yield 6;
      }
      yield 50;
    }
    // にせの GAME OVER（その間も弾は止まらない）
    function* fakeOver() {
      if (G.fake6) G.fake6(W, 'gameover', 120, { cause: '真犯人に負けた。', reveal: 92 });
      G.sfx('death');
      yield 20;
      for (let w = 0; w < 3; w++) {
        const n = 10,
          off = (w % 2) * (Math.PI / n);
        for (let i = 0; i < n; i++) {
          const a = off + (i / n) * Math.PI * 2;
          const f = shot(m.cx, m.cy, 'crescent', 5, 'ゲームオーバーの画面の向こうから撃たれた。');
          f.vel(Math.cos(a) * 1.4, Math.sin(a) * 1.4);
        }
        G.sfx('explode');
        yield 36;
      }
    }

    W.run(function* () {
      yield () => P.alive && P.onGround;
      G.music(null);
      if (!quick && npc) {
        npc.face = 'shock';
        talk(W, npc, '……どうして、わかったの？', 90);
        yield 90;
        npc.face = 'calm';
        talk(W, npc, 'ウソをついていたのは、ぼくだけ……か。', 90);
        yield 90;
        npc.face = 'grin';
        talk(W, npc, 'そうさ。リンゴを落としたのも、\nセーブポイントを作ったのも、ぜんぶぼく。', 130);
        yield 130;
        talk(W, npc, `きみが ${deaths} 回死ぬところ、\nぜんぶ見てたよ。楽しかったなあ。`, 120);
        yield 120;
        talk(W, npc, 'I WANNA KILL THE MOON……\nタイトルどおりだね。やれるものならね！', 130);
        yield 120;
        W.flash = 20;
        W.flashColor = '#fff6c0';
        G.sfx('bigexplode');
        m.x = npc.cx - m.r;
        m.y = npc.cy - m.r;
        npc.alive = false;
      } else {
        m.x = 240 - m.r;
        m.y = -100;
      }
      m.visible = true;
      m.face = 'grin';
      yield* goTo(240, HOMEY, 50, 'outBack');
      if (quick) {
        talk(W, m, `おかえり。${deaths} 回目だね。\n何度でも死なせてあげる。`, 80);
        yield 60;
      }
      G.sfx('roar');
      W.shake = 30;
      G.music('truemoon');
      m.showBar = true;
      m.hazard = true;
      m.vulnerable = true;
      W.autoFire = true;
      if (W.easy) W.lives = 3;
      yield* lieLaser();
      let last = 'lie';
      for (;;) {
        const pool = phase2() ? ['lie', 'phases', 'apples', 'slam', 'saves', 'over'] : ['lie', 'phases', 'apples', 'slam'];
        let p;
        do p = rng.pick(pool);
        while (p === last);
        last = p;
        if (phase2() && !m.angry) {
          m.angry = true;
          m.face = 'rage';
          talk(W, m, 'もう、手加減しないよ。', 60);
          G.sfx('roar');
          yield 40;
        }
        if (p === 'lie') yield* lieLaser();
        else if (p === 'phases') yield* phases();
        else if (p === 'apples') yield* apples();
        else if (p === 'slam') yield* slam();
        else if (p === 'saves') yield* saves();
        else yield* fakeOver();
        if (p !== 'slam') yield* drift();
        yield phase2() ? 12 : 20;
      }
    }, m.ai);

    m.onDefeat = () => {
      G.music(null);
      W.autoFire = false;
      W.god = true;
      W.lives = null;
      W.invuln = 0;
      W.vars.fakeWarn = null;
      W.vars.shadowX = null;
      W.vars.ov = null;
      G.BOSSES.clearShots(W, m);
      G.BOSSES.markDead(W, 'trueMoonDead', 2, 11);
      W.run(function* () {
        m.face = 'hurt';
        m.tweenTo(240 - m.r, 110 - m.r, 30, 'outQuad');
        yield 30;
        talk(W, m, 'うそ……ぼくが、負けるなんて……', 90);
        for (let i = 0; i < 90; i++) {
          m.shakeX = i % 2 ? 2 : -2;
          if (i % 12 === 0) {
            W.burst(m.cx + rng.range(-30, 30), m.cy + rng.range(-30, 30), 14, ['#fff6c0', '#ffffff', '#c8c8d8'], 2.5, { g: 0.05 });
            G.sfx('explode');
          }
          yield 1;
        }
        talk(W, m, 'ねえ……ぼくがいなくなったら、\n夜は真っ暗だよ……？', 110);
        yield 110;
        W.burst(m.cx, m.cy, 160, ['#fff6c0', '#ffffff', '#c8c8d8', '#ffd84a'], 5, { g: 0.06, life: 70 });
        G.sfx('bigexplode');
        W.flash = 24;
        W.flashColor = '#ffffff';
        W.shake = 30;
        m.alive = false;
        m.visible = false;
        m.showBar = false;
        yield 70;
        G.music('ending');
        const sun = W.add(new G.Npc(W, 520, 90, 'sun', { r: 14 }));
        sun.tweenTo(380 - sun.r, 90 - sun.r, 60, 'outQuad');
        yield 60;
        talk(W, sun, '心配するな。夜はわたしが照らそう。\n……いや、夜は休みだった。', 130);
        yield 130;
        const sat = W.add(new G.Npc(W, -40, 110, 'saturn', { r: 16 }));
        sat.tweenTo(100 - sat.r, 110 - sat.r, 60, 'outQuad');
        yield 60;
        talk(W, sat, 'じゃあ、あれを月のかわりにしよう。', 100);
        yield 60;
        // 夜空に、リンゴがのぼる
        const a = W.fruit(240, 250, { kind: 'gold', r: 10, keep: true });
        a.hazard = false;
        a.tweenTo(240 - a.r, 60 - a.r, 120, 'outQuad');
        G.sfx('fanfare');
        yield 130;
        W.text(240, 120, 'I KILLED THE MOON', { size: 20, color: '#ffe9a8' });
        yield 160;
        W.god = !!G.god;
        if (W.game) {
          W.game.endingNote = '最後の死因：なし。ついに月を殺した。（夜空には、リンゴがのぼった）';
          if (W.game.stageClear) W.game.stageClear();
        }
      });
    };
    return m;
  };
})();

</script>
<script>
// 部屋（ステージ）定義

// それ以外の文字は setup() から W.mark() で参照できる目印（空白扱い）
(function () {
  'use strict';
  const G = globalThis.G;
  const T = G.T;

  G.START_ROOM = '1-1';
  // 1面＝エリア1〜4（中ボス：デリシャス・キング／ボス：THE MOON）、2面＝エリア5〜6、3面＝エリア7〜8

    3: { title: 'STAGE 3', name: 'すべての元凶', start: '7-1', story: ['リンゴはなぜ落ちてくるのか。', '太陽の部屋の右の扉から、宇宙へ。'], clearFlags: { holeDead: true, treeDead: true } },
    4: { title: 'STAGE 4', name: '月の裏側', start: '9-1', story: ['本当にリンゴを落としていたのは誰？', 'ニュートンの樹の右の扉から、月の裏側へ。'], clearFlags: { saveBossDead: true } },
    5: { title: 'STAGE 5', name: '天まで届け', start: '10-1', story: ['月がおわびに開けてくれた扉の先は、', '天まで続く塔だった。落ちたら、そこからやり直し。'], clearFlags: { stage5Clear: true } },
    6: { title: 'STAGE 6', name: '宇宙のウソつき', start: '11-1', story: ['てっぺんの先には、宇宙が広がっていた。', 'そこで起きていたのは「連続プレイヤー殺人事件」。'] },
  };
  G.AREAS = {
    1: { stage: 1, title: 'AREA 1  はじまりの草原', sub: '〜 リンゴは上にも落ちる 〜', music: 'grass' },
    2: { stage: 1, title: 'AREA 2  ひみつの洞窟', sub: '〜 天井を見上げるな 〜', music: 'cave' },
    3: { stage: 1, title: 'AREA 3  うそつき城', sub: '〜 看板を信じるな 〜', music: 'castle' },
    4: { stage: 1, title: 'AREA 4  月への階段', sub: '〜 あと少しで月に手が届く 〜', music: 'sky' },
    5: { stage: 2, title: 'AREA 5  灼熱の砂漠', sub: '〜 蜃気楼を信じるな 〜', music: 'desert' },
    6: { stage: 2, title: 'AREA 6  太陽の神殿', sub: '〜 まぶしいものほど危ない 〜', music: 'temple' },
    7: { stage: 3, title: 'AREA 7  さかさまの宇宙', sub: '〜 上も下もない 〜', music: 'void' },
    8: { stage: 3, title: 'AREA 8  ニュートンの庭', sub: '〜 すべてのリンゴはここから落ちる 〜', music: 'garden' },
    9: { stage: 4, title: 'AREA 9  月の裏側', sub: '〜 真実は裏側にある 〜', music: 'farside' },
    10: { stage: 5, title: 'AREA 10  天まで届け', sub: '〜 落ちたら、そこからやり直し 〜', music: 'tower' },
    11: { stage: 6, title: 'AREA 11  嘘つき銀河', sub: '〜 信じたら、死ぬ 〜', music: 'galaxy' },
    12: { stage: 6, title: 'AREA 12  宇宙ステーション', sub: '〜 犯人は、この中にいる 〜', music: 'mystery' },
  };
  const R = (G.ROOMS = {});

  // 罠のタイミング調整表（tools/traps.js で「初見なら死ぬ／知っていれば避けられる」を確認しながら決めた値）

  const TUNE = (G.TUNE = Object.assign(
    {
      c11_trig: 138, c11_delay: 6, c11_g: 1.0, // 1-1 木のリンゴ
      m12_trig: 326, m12_delay: 7, m12_g: 1.0, // 1-2 落ちる月
      m13_delay: 14, // 1-3 岩棚を砕く月
      s13_delay: 34, // 1-3 着地後の天井トゲ
      i3_delay: 16, // 2-2 穴を跳ぶとつらら
      a32_delay: 13, a32_g: 1.0, // 3-2 上に落ちるリンゴ
      a43_delay: 16, // 4-3 月のリンゴ
      st41_tele: 14, // 4-1 狙い撃ちの流れ星
    },
    G.TUNE || {}
  ));
  const P = () => G.game; // eslint-disable-line no-unused-vars
  const Block = G.Block;
  const touchHint = () => (G.isTouch ? 'JUMP' : 'Shift / Z');
  const shotHint = () => (G.isTouch ? 'SHOT' : 'X');

  // =====================================================================

    hint: 'リンゴは近づくと動き出す。立ち止まって様子を見よう。2つ目の穴は2段ジャンプで高く越えよう。',

    name: '1-1 はじまり',
    theme: 'grass',
    bg: 'day',
    exits: { right: '1-2' },
    map: [
      '........................',
      '........................',
      '........................',
      '........................',
      '........................',
      '........................',
      '........................',
      '........................',
      '........................',
      '........................',
      '........................',
      '.@.S....................',
      '##########...#######...#',
      '##########^^^#######^^^#',
    ],
    setup(W) {
      W.decor(150, 110, 'tree', { h: 130 });
      W.decor(260, 220, 'bush');
      W.decor(90, 220, 'flower');
      W.decor(300, 220, 'flower');
      W.decor(380, 220, 'grass');
      W.decor(40, 220, 'grass');
      W.sign(5, 11, `◀ ▶ で移動\n${touchHint()} でジャンプ（空中でもう1回）\n${shotHint()} でショット`);

      // ① 木のリンゴが落ちてくる（真下に来た瞬間に一気に落ちる）
      const a1 = W.fruit(172, 152, { cause: 'リンゴは落ちてくるものだ。', splat: true });
      W.trigPx(TUNE.c11_trig, 0, 10, 280, () => {

          a1.vel(0, 0.5, 0, TUNE.c11_g);
          G.sfx('whoosh');

      const a2 = W.fruit(230, 254, { cause: 'リンゴは上にも落ちる。' });
      W.trigPx(176, 0, 30, 280, () => {
        W.after(19, () => {
          a2.vel(0, -7);
          G.sfx('whoosh');

    },
    // 見えないブロックで頭を打ってから落ちた時だけ専用の死因
    spikeCauseFn(W) {
      return W.ents.some((e) => e instanceof G.Block && e.visible && e.y === 180) ? '見えないブロックにぶつかった。' : null;
    },
  };

  R['1-2'] = {
    hint: '橋の4つ目は飛び越えよう。月は転がり去っても出口の手前で戻ってくる。跳び越えよう。',
    area: 1,
    name: '1-2 月が見ている',
    theme: 'grass',
    bg: 'day',
    exits: { left: '1-1', right: '1-3' },
    map: [
      '.......................#',
      '.......................#',
      '.......................#',
      '.......................#',
      '.......................#',
      '.......................#',
      '.......................#',
      '.......................#',
      '.......................#',
      '.......................#',
      '........................',
      '.S..........s...........',
      '###BBBBBBBB#############',

    setup(W) {
      W.decor(420, 220, 'bush');
      W.decor(250, 220, 'flower');
      W.decor(330, 220, 'grass');
      // 橋：4つ目は踏むと抜ける、7つ目は少しして崩れる

      // 月
      const moon = W.moon(370, 62, { r: 22, keep: true, cause: '月が落ちてきた。' });

      W.trigPx(TUNE.m12_trig, 0, 200, 280, () => {
        moon.face = 'grin';
        W.after(TUNE.m12_delay, () => {
          moon.layer = 3;
          G.sfx('trap');

        W.say('ただいま', 440, 180, 50, {});

  R['1-3'] = {
    hint: 'トゲの手前で小ジャンプすると先に飛んでいく。真ん中の足場はすぐ跳び、右上の足場では一呼吸。',

    name: '1-3 天井に注意',
    theme: 'grass',
    bg: 'dusk',
    exits: { left: '1-2', up: '1-4' },
    goal: 'up',
    map: [

  // ドッスン（天井から落ちてくる顔つき岩）
  function thwomp(W, tx, ty, o) {
    o = o || {};
    const b = W.block(tx, ty, o.w || 2, o.h || 2, { style: 'thwomp', keep: true, squishCause: o.cause || 'ドッスンに潰された。' });
    b.home = b.y;
    b.spikesBelow = !!o.spikes;
    const floorY = o.floorY || 240;
    W.run(function* () {
      for (;;) {
        yield () => W.player.alive && o.when(W.player, b);
        if (o.fake && !b.faked) {
          b.faked = true;
          b.angry = true;
          b.shakeT = o.fake;
          G.sfx('trap');
          yield o.fake;
          b.angry = false;
          continue;
        }
        b.angry = true;
        if (o.shake) {
          b.shakeT = o.shake;
          G.sfx('trap');
          yield o.shake;
        }
        b.vel(0, o.v0 || 1, 0, o.acc || 0.7);
        b.maxV = 10;
        yield () => b.y + b.h >= floorY;
        b.stop();
        b.y = floorY - b.h;
        b.yr = 0;
        W.shake = 8;
        G.sfx('stomp');
        W.burst(b.cx, floorY, 10, ['#8a7a9a', '#5a4a6a'], 1.5, { up: 1, g: 0.1, life: 25 });
        yield o.stay || 40;
        if (o.double) {
          // 少しだけ上がって油断させてから、もう一度落ちる
          b.vel(0, -1);
          yield () => b.y <= floorY - b.h - o.double;
          b.stop();
          b.shakeT = 6;
          yield 6;
          b.vel(0, 2, 0, 0.9);
          yield () => b.y + b.h >= floorY;
          b.stop();
          b.y = floorY - b.h;
          b.yr = 0;
          W.shake = 8;
          G.sfx('stomp');
          yield o.stay || 40;
        }
        b.vel(0, -(o.up || 1));
        yield () => b.y <= b.home;
        b.stop();
        b.y = b.home;
        b.yr = 0;
        b.angry = false;
        yield o.cool || 20;
      }
    });
    return b;
  }

        W.sealFloor();
        W.run(function* () {
          yield 40;
          yield* G.BOSSES.moonAftermath(W);
        });
        return;
      }
      G.BOSSES.moon(W, opts);
    },
  };
})();

<script>
// 2面（エリア5〜6）・3面（エリア7〜8）の部屋
// マップ記号は rooms.js と同じ。F は乗ると落ちる偽の床（見た目は地面）
(function () {
  'use strict';
  const G = globalThis.G;
  const T = G.T;
  const R = G.ROOMS;
  const Ent = G.Ent;
  const shotHint = () => (G.isTouch ? 'SHOT' : 'X');

  // ---------------------------------------------------------------------
  // 2面以降の小物
  // ---------------------------------------------------------------------
  // 地面を歩く敵。daruma：背中を向けると追ってくる（見ている間は止まる） walk：決まった向きに歩き続ける
  class Walker extends Ent {
    constructor(W, x, y, o) {
      super(W, x, y, o.w || 14, o.h || 20);
      this.kind = o.kind || 'cactus';
      this.mode = o.mode || 'daruma';
      this.hazard = true;
      this.shootable = o.hp > 0;
      this.hp = o.hp || 0;
      this.cause = o.cause;
      this.speed = o.speed || 2;
      this.dir = o.dir || 1;
      this.stopX = o.stopX;
      this.layer = 2;
      this.fallV = 0;
      this.hurtT = 0;
      this.moving = false;
      this.awake = this.mode !== 'daruma';
      this.offscreenKill = 60;
    }
    tick() {
      const W = this.W,
        P = W.player;
      if (this.hurtT > 0) this.hurtT--;
      let mv = 0;
      if (this.mode === 'daruma') {
        if (!this.awake && P.alive && Math.abs(P.cx - this.cx) < 70) this.awake = true;
        const back = P.alive && Math.sign(P.cx - this.cx) === P.face;
        if (this.awake && back && Math.abs(P.cx - this.cx) > 2) mv = Math.sign(P.cx - this.cx) * this.speed;
      } else if (this.awake) {
        mv = this.dir * this.speed;
        if (this.stopX != null && (this.dir > 0 ? this.cx >= this.stopX : this.cx <= this.stopX)) mv = 0;
      }
      this.moving = !!mv;
      this.x += mv;
      // 足もとに地面がなければ落ちる
      if (!W.solidAt(this.x + 2, this.y + this.h, this.w - 4, 1)) {
        this.fallV = Math.min(6, this.fallV + 0.3);
        this.y += this.fallV;
      } else this.fallV = 0;
      if (this.y > G.H + 20) this.alive = false;
    }
    onShot() {
      if (!this.shootable) return false;
      this.hp--;
      this.hurtT = 4;
      G.sfx('hit');
      if (this.hp <= 0) {
        this.alive = false;
        G.sfx('crumble');
        this.W.burst(this.cx, this.cy, 18, this.kind === 'cactus' ? ['#4aa040', '#8ae060', '#e8d890'] : ['#d8ccb0', '#8a7a60'], 2, { g: 0.15, life: 30 });
      }
      return true;
    }
    draw(ctx) {
      G.Render.drawWalker(ctx, this);
    }
  }
  G.Walker = Walker;
  G.World.prototype.walker = function (x, y, o) {
    return this.add(new Walker(this, x, y, o || {}));
  };

  // 下から突き上げる砂の柱（先端がトゲ）
  function sandPillar(W, tx, tw, topY, o) {
    const p = W.hbox(tx * T + 2, 300, tw * T - 4, 150, { kind: 'pillar', cause: o.cause });
    p.offscreenKill = false;
    p.rise = () => {
      W.run(function* () {
        p.tweenTo(p.x, topY, o.up || 8, 'outQuad');
        G.sfx('pop');
        W.shake = 8;
        yield (o.up || 8) + (o.stay || 40);
        p.tweenTo(p.x, 300, 24, 'inQuad');
      });
    };
    return p;
  }

  // 床の通気口から噴き出す炎（縦のレーザー）
  function fireJet(W, tx, o) {
    return W.laser(tx * T + 4, o.top || 40, 12, 240 - (o.top || 40), { warn: o.warn, dur: o.dur || 30, cause: o.cause || '炎に焼かれた。', color: '#ff7a20' });
  }

  // =====================================================================
  // AREA 5 灼熱の砂漠
  // =====================================================================
  R['5-1'] = {
    hint: 'ハゲワシは急降下を見てから一歩引こう。サボテンには背中を見せず、向き合って撃とう。光る床は蜃気楼。穴の柱が引っこんでから跳び、出口の手前では一度止まろう。',
    area: 5,
    name: '5-1 蜃気楼',
    theme: 'desert',
    bg: 'desert',
    exits: { left: '4-B', right: '5-2' },
    edgeOk: ['left'], // 4-B の右の扉は1面クリア後に開く
    map: [
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '........................',
      '........................',
      '.@.S............s.......',
      '#######..####FF###..####',
      '#######^^####^^###^^####',
    ],
    spikeCauseFn: (W) => {
      const x = W.player.cx;
      if (x > 256 && x < 304) return '床は蜃気楼だった。';
      return null;
    },
    setup(W) {
      W.decor(40, 180, 'palm');
      W.decor(170, 222, 'skull');
      W.decor(430, 200, 'cactusbg');
      W.decor(330, 210, 'cactusbg', { small: true });
      W.sign(5, 11, `ようこそ 2面へ\n${shotHint()} で撃てるのを忘れずに`, { range: 30 });
      // ⓪ ハゲワシ：上空を飛んできて、歩いている先へ急降下（止まっていると真上から）
      W.trigPx(100, 0, 20, 280, () => {
        const b = W.fruit(500, 70, { kind: 'bird', r: 7, cause: 'ハゲワシに狙われた。' });
        b.vel(-2.6, 0);
        b.dived = false;
        b.offscreenKill = 60;
        b.tick = function () {
          const P = W.player;
          if (!this.dived && P.alive && Math.abs(P.cx - this.cx) < 70) {
            this.dived = true;
            const tx = P.cx + P.vx * 26,
              ty = 232;
            const dx = tx - this.cx,
              dy = ty - this.cy;
            const d = Math.hypot(dx, dy) || 1;
            this.vel((dx / d) * 4.2, (dy / d) * 4.2);
            G.sfx('whoosh');
          }
        };
        G.sfx('warn');
      }, { cond: (P) => P.onGround });
      // ① だるまさんがころんだサボテン：背中を向けると追ってくる。向き合って3発撃てば倒せる
      W.walker(11 * T + 3, 11 * T, { cause: 'だるまさんがころんだ。', hp: 3, speed: 2.6 });
      // ② 13〜14列目の床は蜃気楼（F）
      // ③ 穴の手前に来ると、砂の中から柱が突き上げる
      const pil = sandPillar(W, 18, 2, 166, { cause: '砂の中から何か出てきた。' });
      W.trigPx(330, 0, 30, 280, () => pil.rise(), { cond: (P) => P.onGround });
      // ④ 出口の手前：歩いている先に日差しが落ちる
      W.trigPx(430, 0, 20, 280, () => {
        const x = G.clamp(W.player.cx + 32, 10, 470);
        W.laser(x - 7, 0, 14, 240, { warn: 18, dur: 22, cause: '日差しに先回りされた。', color: '#ffb030' });
        G.sfx('charge');
      }, { cond: (P) => P.onGround });
    },
  };

  R['5-2'] = {
    hint: '砂嵐は空中にいる時だけ流される。風がやんでから跳ぼう。2つ目の島の真ん中には立たない。右の足場は罠。最後の穴の手前で一度跳んで、下降気流をやり過ごそう。',
    area: 5,
    name: '5-2 砂嵐',
    theme: 'desert',
    bg: 'desert',
    exits: { left: '5-1', right: '5-3' },
    map: [
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '........................',
      '.....--.......--........',
      '..S.....s...............',
      '####^^^^####^^^^###^^^##',
      '########################',
    ],
    spikeCauseFn: (W) => {
      if (W.gravScale > 1) return '下降気流に叩き落とされた。';
      if (W.vars.platDrop && W.player.cx > 250 && W.player.cx < 330) return '足場は蜃気楼だった。';
      return W.windX < 0 ? '砂嵐に流された。' : null;
    },
    setup(W) {
      W.decor(200, 200, 'skull');
      W.decor(450, 200, 'cactusbg', { small: true });
      W.windAir = true;
      W.sign(1, 11, '砂嵐注意\n（空中で流されます）', { range: 30 });
      W.sign(17, 11, '風がやんだ', { range: 24 });
      W.vars.windWarn = 0;
      // 砂嵐：予告（40）→突風（75）→凪（120）のくり返し
      W.run(function* () {
        yield 50;
        for (;;) {
          W.vars.windWarn = 1;
          G.sfx('rumble');
          yield 40;
          W.vars.windWarn = 0;
          W.vars.gust = 1;
          W.windX = -1.15;
          yield 75;
          W.vars.gust = 0;
          W.windX = 0;
          yield 120;
        }
      });
      // ⓪ 2つ目の島の真ん中（10列目）に立つと砂からヘビ
      W.popSpike(10, 11, 'u', [10, 9, 1, 3], { cause: '砂の中にヘビがいた。', cond: (P) => P.onGround, pal: 'gold' });
      // ① 右の足場は蜃気楼：乗ると抜ける
      for (const tx of [14, 15]) {
        const b = W.tileToBlock(tx, 10, { oneway: true });
        b.onStep = () => {
          W.vars.platDrop = true;
          W.after(6, () => b.drop(0.5));
        };
      }
      // ② 最後の穴を跳ぶと下降気流（重力が強くなって届かない）
      W.trigPx(368, 0, 72, 280, () => {
        W.gravScale = 2.4;
        G.sfx('whoosh');
        W.say('ズシッ', 380, 150, 40, { plain: true, size: 11, color: '#ffe0a0' });
        W.after(40, () => (W.gravScale = 1));
      }, { cond: (P) => !P.onGround });
    },
    drawFg(ctx, W) {
      G.Render.drawSandstorm(ctx, W);

  };

  R['5-3'] = {
    hint: '床の板は踏まない。お宝には触らない。ミイラが起きたら立ち止まらず、落とし穴は大きく跳び越えよう。出口の手前では大岩を跳ぼう。',
    area: 5,
    name: '5-3 ピラミッド',
    theme: 'temple',
    bg: 'temple',
    exits: { left: '5-2', right: '5-B' },
    map: [
      '########################',
      '########################',
      '########################',
      '########################',
      '########################',
      '########################',
      '########################',
      '#......................#',
      '#......................#',
      '........................',
      '........................',
      '..S..........s..........',
      '########################',
      '##################^^^###',
    ],
    spikeCauseFn: (W) => (W.player.cx > 350 && W.player.cx < 430 ? '落とし穴だった。' : null),
    setup(W) {
      W.decor(40, 150, 'torch');
      W.decor(440, 150, 'torch');
      W.decor(240, 146, 'hiero');
      W.sign(4, 11, 'ピラミッドへ ようこそ\n（さわらないでください）', { range: 30 });
      // ① 床の板を踏むと前後から矢
      W.decor(7 * T, 11 * T, 'plate');
      W.trig(7, 11, 1, 1, () => {
        G.sfx('trap');
        const a = W.spikePx(-24, 220, 'r', { cause: '罠を踏んだ。前後から矢。' });
        a.vel(7, 0);
        const b = W.spikePx(484, 220, 'l', { cause: '罠を踏んだ。前後から矢。' });
        b.vel(-7, 0);
      }, { cond: (P) => P.onGround });
      // ② お宝に触ると天井が落ちる
      const gold = W.fruit(230, 232, { kind: 'gold', r: 6, keep: true });
      gold.hazard = false;
      for (let tx = 10; tx <= 12; tx++) for (let ty = 5; ty <= 6; ty++) W.setTile(tx, ty, 0);
      const slab = W.block(10, 5, 3, 2, { keep: true, squishCause: 'お宝に目がくらんだ。' }); // 天井と同じ見た目
      W.trigPx(224, 226, 12, 14, () => {
        gold.alive = false;
        G.sfx('fanfare');
        W.after(4, () => {
          slab.vel(0, 2, 0, 1.2);
          G.sfx('trap');
        });
        W.run(function* () {
          yield () => slab.y + slab.h >= 240;
          slab.stop();
          slab.y = 240 - slab.h;
          W.shake = 14;
          G.sfx('stomp');
        });
      });
      // ③ 棺の前を通るとミイラが起きて追ってくる
      W.decor(15 * T, 9 * T, 'coffin', { h: 40 });
      const mummy = W.walker(15 * T + 3, 10 * T, { kind: 'mummy', mode: 'walk', speed: 1.15, h: 20, w: 14, cause: 'ミイラに抱きしめられた。' });
      mummy.awake = false;
      mummy.visible = false;
      mummy.hazard = false;
      mummy.y = 11 * T;
      W.trigPx(326, 0, 40, 280, () => {
        mummy.awake = true;
        mummy.visible = true;
        mummy.hazard = true;
        G.sfx('rumble');
        W.say('ウゥ……', 310, 190, 40, { plain: true, size: 10, color: '#d8ccb0' });
      });
      // ⑤ 出口の手前で大岩が転がってくる
      W.trigPx(432, 0, 20, 280, () => {
        const r = W.rock(500, 240 - 12, { r: 12, cause: 'ピラミッドといえば大岩。' });
        r.vel(-3, 0);
        G.sfx('rumble');
      }, { cond: (P) => P.onGround });
      // ④ 落とし穴（18〜20列目）
      const door = [18, 19, 20].map((tx) => W.tileToBlock(tx, 12, { keep: true }));
      let opened = false;
      for (const b of door)
        b.onStep = () => {
          if (opened) return;
          opened = true;
          W.after(5, () => door.forEach((d) => d.drop(0.6)));
        };
    },
  };

  R['5-B'] = {
    hint: '針の雨は落ちる場所を見て、低い針は跳び、高い針は地面で待とう。倒した後、倒れてくる方向に立たないこと。',
    area: 5,
    name: '中ボス サボテン将軍',
    theme: 'desert',
    bg: 'desert',
    music: null,
    exits: { left: '5-3', right: '6-1' },
    edgeOk: ['right'], // 右の壁は撃破後に開く
    goal: 'right',
    map: [
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#..----..........----..#',
      '.......................#',
      '.......................#',
      '.......................#',
      '########################',
      '########################',
    ],
    setup(W, opts) {
      W.decor(60, 200, 'skull');
      W.decor(400, 200, 'cactusbg', { small: true });
      const openRight = (fx) => {
        for (let ty = 9; ty <= 11; ty++) W.setTile(23, ty, 0);
        if (fx) {
          W.burst(470, 200, 30, ['#d8a85a', '#f0c878', '#ffffff'], 2.5, { g: 0.15 });
          G.sfx('crumble');
        }
      };
      if (W.game && W.game.flags.cactusDead) {
        openRight(false);
        W.save(20, 11);
        W.sign(18, 11, '将軍は眠る。\nこの先、太陽の神殿');
        return;
      }
      W.closeGate = () => {
        const g = W.block(0, 6, 1, 3, { style: 'gate', keep: true });
        g.tweenTo(g.x, 180, 18, 'outBounce');
        G.sfx('stomp');
      };
      W.sign(12, 11, 'ただのサボテンです', { range: 40 });
      G.BOSSES.cactus(W, opts);
      W.onBossCleared = () => {
        openRight(true);
        W.save(20, 11);
        for (const e of W.ents) if (e instanceof G.Sign) e.alive = false;
      };
    },
  };

  // =====================================================================
  // AREA 6 太陽の神殿
  // =====================================================================
  R['6-1'] = {
    hint: '炎は左から順に噴く。太陽の目の真下では待たない。止まりすぎても焼かれる。最後の通気口は近づいて一度噴かせてから通ろう。',
    area: 6,
    name: '6-1 炎の回廊',
    theme: 'temple',
    bg: 'temple',
    exits: { left: '5-B', right: '6-2' },
    edgeOk: ['left'], // 5-B の右の壁は撃破後に開く
    map: [
      '########################',
      '########################',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '........................',
      '........................',
      '..S.....................',
      '########################',
      '########################',
    ],
    setup(W) {
      W.decor(232, 44, 'sunrelief');
      W.decor(40, 150, 'torch');
      W.decor(440, 150, 'torch');
      for (const tx of [6, 10, 14, 18]) W.decor(tx * T, 11 * T, 'vent');
      // ① 炎は左から順番に噴く（150フレーム周期）
      W.run(function* () {
        for (;;) {
          fireJet(W, 6, { warn: 30 });
          yield 50;
          fireJet(W, 10, { warn: 30 });
          yield 50;
          fireJet(W, 14, { warn: 30 });
          yield 50;
        }
      });
      // ② 最後の通気口だけは近づいた瞬間に噴く
      let cool = 0;
      W.onStep = () => {
        if (cool > 0) cool--;
        const P = W.player;
        if (!cool && P.alive && P.cx > 338 && P.cx < 400) {
          fireJet(W, 18, { warn: 6, cause: '最後の炎はフェイントだった。' });
          cool = 150;
        }
        // ③ 止まりすぎると太陽の目が焼いてくる
        // 入口のセーブ付近では数えない（リスポーン直後に焼かれないように）
        if (P.alive && P.onGround && !P.vx && P.cx > 80) W.vars.still = (W.vars.still || 0) + 1;
        else W.vars.still = 0;
        // ⑤ 太陽のレリーフの真下に立つと火の玉
        if (!W.vars.eyeCd && P.alive && P.onGround && Math.abs(P.cx - 240) < 16) {
          W.vars.eyeCd = 100;
          W.after(8, () => {
            const f = W.fruit(240, 66, { kind: 'fire', r: 6, cause: '太陽の目の真下に立っていた。' });
            f.vel(0, 4.5);
            G.sfx('shoot');
          });
        }
        if (W.vars.eyeCd > 0) W.vars.eyeCd--;
        if (W.vars.still > 110) {
          W.laser(P.cx - 8, 40, 16, 200, { warn: 26, dur: 18, cause: '太陽の視線に焼かれた。止まりすぎ。', color: '#ffd84a' });
          G.sfx('charge');
          W.vars.still = -40;
        }
      };
      // ④ 逃げるセーブポイント
      const sv = W.save(12, 11);
      const hops = [16, 21];
      let n = 0;
      sv.tick = function () {
        if (this.tw) return;
        const P = W.player;
        if (n < hops.length && P.alive && Math.abs(P.cx - this.cx) < 40) {
          this.tweenTo(hops[n] * T, this.y, 26, 'outQuad');
          W.say(n === 0 ? 'いやだ！' : 'こないで！', this.cx, this.y - 6, 40, { plain: true, size: 9, color: '#9affc0' });
          G.sfx('boing');
          n++;
          return;
        }
        if (n === hops.length && !this.tired) {
          this.tired = true;
          W.say('……つかれた', this.cx, this.y - 6, 50, { plain: true, size: 9, color: '#9affc0' });

        G.SavePoint.prototype.tick.call(this);
      };

  };

  R['6-2'] = {
    hint: '昇る足場は途中で急加速するので、早めに右の足場へ。火の玉は落ちた直後に。出口のトゲは一度出させて引っこむのを待とう。',
    spikeCauseFn: (W) => (W.vars.liftFast && W.player.y < 60 ? 'エレベーターが急加速した。' : null),
    area: 6,
    name: '6-2 光の縦穴',
    theme: 'temple',
    bg: 'temple',
    exits: { left: '6-1', up: '6-3' },
    goal: 'up',
    map: [
      '###########....#########',
      '#..............vv......#',
      '#......................#',
      '#......................#',
      '#..........---.........#',
      '#......................#',
      '#.................---..#',
      '#......................#',
      '#......................#',
      '.......................#',
      '........---............#',
      '..S....................#',
      '########################',
      '########################',
    ],
    setup(W) {
      W.decor(40, 150, 'torch');
      W.decor(440, 60, 'torch');
      // ① 昇る足場：乗ると止まらずに天井のトゲまで昇る
      const el = W.block(14, 10, 2, 1, { oneway: true, code: 3, keep: true, style: 'lift' });
      el.home = el.y;
      el.onStep = () => {
        if (el.going) return;
        el.going = true;
        G.sfx('rumble');
        el.vel(0, -1.1);

  // 撃つと倒れる大きな木（倒れた先が橋になる）
  class BigTree extends Ent {
    constructor(W, x, floorY) {
      super(W, x - 8, floorY - 180, 16, 180);
      this.shootable = true;
      this.hp = 4;
      this.rot = 0;
      this.layer = -0.7;
      this.state = 'stand';
      this.hurtT = 0;
    }
    shotBox() {
      return { x: this.x - 4, y: this.y + 60, w: this.w + 8, h: 120 };
    }
    onShot() {
      if (this.state !== 'stand') return false;
      this.hp--;
      this.hurtT = 4;
      G.sfx('hit');
      if (this.hp <= 0) {
        this.state = 'fall';
        G.sfx('crumble');
        this.W.say('メキメキ…', this.cx, this.y + 40, 40, { plain: true, size: 10, color: '#c0ff90' });
      }
      return true;
    }
    tick() {
      if (this.hurtT > 0) this.hurtT--;
      if (this.state === 'fall') {
        this.rot = Math.min(Math.PI / 2, this.rot + 0.008 + this.rot * 0.06);
        if (this.rot >= Math.PI / 2) {
          this.state = 'down';
          this.W.shake = 16;
          G.sfx('stomp');

            this.vx += (dx / d) * 0.09;

            const v = Math.hypot(this.vx, this.vy);
            if (v > 1.5) {
              this.vx *= 1.5 / v;

            if (++this.pullT > 110) {

  R['8-3'] = {

<script>
// 4面（エリア9）月の裏側：真ん中の部屋から東・南・北へ分かれ、謎を解いて「月のかけら」を3つ集める
(function () {
  'use strict';
  const G = globalThis.G;
  const T = G.T;
  const R = G.ROOMS;
  const Ent = G.Ent;
  const shotHint = () => (G.isTouch ? 'SHOT' : 'X');

  // ---------------------------------------------------------------------
  // 4面の小物
  // ---------------------------------------------------------------------
  // 扉：開いていれば触れると別の部屋へ。kill を渡すと入った瞬間に死ぬ扉（ハズレ）
  class Door extends Ent {
    constructor(W, tx, ty, o) {
      super(W, tx * T, ty * T, T, T * 2);
      this.to = o.to;
      this.spawn = o.spawn;
      this.open = o.open !== false;
      this.label = o.label || '';
      this.kill = o.kill;
      this.locked = o.locked;
      this.big = !!o.big;
      this.layer = -0.8;
      this.used = false;
      if (this.big) {
        this.x -= T / 2;
        this.w = T * 2;
      }
    }
    tick() {
      const W = this.W,
        P = W.player;
      if (this.used || !P.alive) return;
      const hit = G.overlap(P, { x: this.x + 4, y: this.y + 4, w: this.w - 8, h: this.h - 4 });
      // 部屋に入った時に扉と重なっていたら、一度離れるまで反応しない
      if (this.armed === undefined) this.armed = !hit;
      if (!hit) {
        this.armed = true;
        return;
      }
      if (!this.armed) return;
      if (!this.open) {
        if (this.locked) W.kill(this.locked);
        return;
      }
      this.used = true;
      if (this.kill) return W.kill(this.kill);
      G.sfx('door');
      W.vars.goal = this.to;
      if (W.game && W.game.warp) W.game.warp(this.to, this.spawn[0], this.spawn[1]);
    }
    draw(ctx) {
      G.Render.drawDoor(ctx, this);
    }
  }
  G.World.prototype.door = function (tx, ty, o) {
    return this.add(new Door(this, tx, ty, o));
  };

  // 月のかけら（3つ集めると真ん中の扉が開く）
  class Piece extends Ent {
    constructor(W, cx, cy, flag, o) {
      super(W, cx - 7, cy - 7, 14, 14);
      this.flag = flag;
      this.fake = !!(o && o.fake);
      this.layer = o && o.layer != null ? o.layer : 2;
      this.cause = o && o.cause;
    }
    tick() {
      const W = this.W,
        P = W.player;
      this.y += Math.sin(this.t * 0.08) * 0.15;
      if (!P.alive || !G.overlap(P, this)) return;
      if (this.fake) {
        this.alive = false;
        W.burst(this.cx, this.cy, 40, ['#ff5a10', '#ffd84a', '#ffffff'], 3, { g: 0.1 });
        G.sfx('explode');
        W.kill(this.cause || 'かけらは偽物だった。');
        return;
      }
      this.alive = false;
      if (W.game) {
        W.game.flags[this.flag] = true;
        if (W.game.writePersist) W.game.writePersist();
      }
      const n = ['piece1', 'piece2', 'piece3'].filter((f) => W.game && W.game.flags[f]).length;
      G.sfx('fanfare');
      W.burst(this.cx, this.cy, 30, ['#fff6c0', '#ffd84a', '#ffffff'], 2.5, { g: 0, life: 40 });
      W.say(`月のかけらを手に入れた！（${n}/3）`, 240, 90, 120, { plain: true, size: 13, color: '#fff2a8' });
      if (this.onGet) this.onGet();
    }
    draw(ctx) {
      G.Render.drawPiece(ctx, this);
    }
  }
  G.World.prototype.piece = function (cx, cy, flag, o) {
    if (!(o && o.fake) && this.game && this.game.flags[flag]) return null;
    return this.add(new Piece(this, cx, cy, flag, o));
  };

  // 撃つと点く印つきスイッチ（順番の謎解き用）
  class MarkSwitch extends Ent {
    constructor(W, tx, ty, mark, onHit) {
      super(W, tx * T + 2, ty * T + 2, T - 4, T - 4);
      this.mark = mark;
      this.onHit = onHit;
      this.shootable = true;
      this.on = false;
      this.layer = 1;
    }
    onShot() {
      if (!this.on && this.onHit) this.onHit(this);
      return true;
    }
    draw(ctx) {
      G.Render.drawMarkSwitch(ctx, this);
    }
  }

  const haveAll = (W) => !!(W.game && W.game.flags.piece1 && W.game.flags.piece2 && W.game.flags.piece3);

  // =====================================================================
  // AREA 9 月の裏側
  // =====================================================================
  R['9-1'] = {
    hint: '旗は倒れてくるので、一度近づいて倒させてから跳び越えよう。足場の下はうさぎの餅に注意。',
    area: 9,
    name: '9-1 月の裏側',
    theme: 'moon',
    bg: 'farside',
    exits: { left: '8-B', right: '9-H' },
    edgeOk: ['left'], // 8-B の右の扉は3面クリア後に開く
    map: [

      '..S.....................',
      '#####...######...#######',
      '#####^^^######^^^#######',
    ],
    setup(W) {
      W.sign(4, 11, '月の裏側へようこそ\n（地球がきれいに見えます）', { range: 30 });
      // ① 人類の旗：そばを通ると進む向きに倒れてくる
      W.decor(9 * T, 9 * T, 'moonflag', { h: 40 });
      const pole = W.hbox(0, 0, 1, 1, { cause: '人類の偉大な一歩に踏まれた。' });
      pole.alive = false;
      W.trigPx(176, 0, 20, 280, () => {

      // ② 足場の上のうさぎが餅を落とす

      }, { cond: (P) => P.onGround });
      // ③ 2つ目のクレーターを跳ぶと隕石
      W.trigPx(276, 0, 70, 280, () => {
        const r = W.fruit(316, -12, { kind: 'rock', r: 8, cause: 'クレーターは今まさにできるところだった。' });
        r.vel(0, 7);
        G.sfx('whoosh');
      }, { cond: (P) => !P.onGround });
    },
  };

  R['9-H'] = {
    hint: '真ん中の扉はかけらが3つ揃うまで触ると危ない（跳び越えよう）。東は順番、南は重力、北は看板の謎。',
    area: 9,
    name: '9-H 三つの道',
    theme: 'moon',
    bg: 'farside',
    exits: { left: '9-1', right: '9-B1', up: '9-A1', down: '9-C1' },
    map: [
      '###...##################',
      '#......................#',
      '#......................#',
      '#..---.................#',
      '#......................#',
      '#......................#',
      '#.----.................#',
      '#......................#',
      '#......................#',
      '..----..................',
      '........................',
      '.......S................',
      '##################...###',
      '##################...###',
    ],
    setup(W) {
      W.sign(9, 11, '↑北：うそつき看板\n→東：順番の間\n↓南：重力の部屋', { range: 30 });
      const all = haveAll(W);
      W.door(12, 10, {
        to: '9-X', spawn: [2, 11], big: true, open: all,
        locked: 'せっかちは身を滅ぼす。かけらを3つ集めてから。',
      });
      W.vars.sockets = ['piece1', 'piece2', 'piece3'].map((f) => !!(W.game && W.game.flags[f]));
      if (all) W.say('扉が開いている……', 240, 160, 90, { plain: true, size: 11, color: '#fff2a8' });
    },
    drawFg(ctx, W) {
      G.Render.drawSockets(ctx, W, 240, 182);
    },
  };

  // ------------------------- 東 -------------------------
  R['9-B1'] = {
    hint: '「朝に昇り・夜に笑い・願いをかなえる」＝太陽→月→星の順に撃つ。間違えたら足場の上へ逃げよう。',
    area: 9,
    name: '9-B1 順番の間',
    theme: 'moon',
    bg: 'farside',
    exits: { left: '9-H', right: '9-B2' },
    map: [
      '########################',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#......................#',
      '#..........---.........#',
      '#......................#',
      '#......................#',
      '......---...............',
      '........................',
      '........................',
      '########################',
      '########################',
    ],
    setup(W) {
      W.sign(3, 11, '朝に昇るもの、夜に笑うもの、\n願いをかなえるもの。\nその順に撃て。', { range: 34 });
      const gate = W.block(22, 9, 1, 3, { style: 'gate', keep: true });

      const order = ['sun', 'moon', 'star'];
      let got = [];

      const reset = () => {
        got = [];
        sws.forEach((s) => (s.on = false));

      const hit = (s) => {
        s.on = true;
        G.sfx('switch');
        got.push(s.mark);
        const ok = got.every((m, i) => m === order[i]);
        if (!ok) {

          W.say('ブブーッ', 240, 120, 50, { plain: true, size: 14, color: '#ff6a8a' });

  R['9-B2'] = {

    theme: 'moon',
    bg: 'farside',
    exits: { up: '9-H', right: '9-C2' },
    map: [
      '##################...###',
      '#.......vv...v.........#',
      '#......................#',

  R['9-A3'] = {

    setup(W) {

      // 押すとクリア……のはずが天井が落ちてくる

      W.switchAt(5, 11, () => {

  // ------------------------- 月の中心 -------------------------
  R['9-X'] = {

<script>
// 5面（エリア10）天まで届け：上へ上へと積み重なった塔。踏み外すと下の画面へ落ちていき、
// 着地した場所に自動でセーブされる（一番下まで落ちれば、実質はじめから）
(function () {
  'use strict';
  const G = globalThis.G;
  const T = G.T;
  const R = G.ROOMS;

  // 塔のマップを足場の一覧から作る（左右は壁、上下は穴でつながっている）
  //  plats: [列, 幅, 行, 文字]  文字は # 足場（下からは頭を打つ）/ - すり抜け足場（下の画面から跳び上がってくる入口）/ F 偽物 / B 崩れる
  function towerMap(o) {
    const rows = [];
    for (let r = 0; r < 14; r++) rows.push(['#'].concat(new Array(22).fill('.'), ['#']));
    const floorRows = o.floor === 'low' ? [13] : [12, 13];
    if (o.floor) for (const r of floorRows) for (let c = 1; c <= 22; c++) rows[r][c] = '#';
    if (o.floorHole) for (const r of floorRows) for (let c = o.floorHole[0]; c <= o.floorHole[1]; c++) rows[r][c] = '.';
    if (o.ceilHole) for (let c = 1; c <= 22; c++) rows[0][c] = c >= o.ceilHole[0] && c <= o.ceilHole[1] ? '.' : '#';
    for (const [c, w, r, ch] of o.plats || []) for (let i = 0; i < w; i++) rows[r][c + i] = ch || '#';
    for (const [c, r, ch] of o.marks || []) rows[r][c] = ch;
    return rows.map((a) => a.join(''));
  }

  const FALL_LINES = [
    '落ちることも、登山のうち。',
    'おかえり。',
    '重力は、いつでもきみの味方だ。……いや、敵か。',
    'また同じ景色だね。',
    'あきらめなければ、いつか届く。たぶん。',
    '壺に入っていなくてよかったね。',
    'さっきの場所、けっこう高かったのに。',
    '人生も、塔も、落ちてからが本番だ。',
  ];

  // 塔の部屋の共通処理：着地するたびに自動セーブ、高さの表示、落ちてきた時のひとこと
  function tower(W, k, opts) {
    W.vars.tower = k;
    let wasGround = false;
    const game = W.game;
    const prev = W.onStep;
    W.onStep = () => {
      if (prev) prev();
      const P = W.player;
      if (!P.alive) return;
      const h = Math.max(0, Math.round(((k - 1) * 280 + (280 - (P.y + P.h))) / 10));
      W.vars.height = h;
      if (game && game.flags) game.flags.towerMax = Math.max(game.flags.towerMax || 0, h);
      if (P.onGround && !wasGround) {
        // 動かない地形の上に着地した時だけ、その場所をセーブ
        const tx = Math.floor(P.cx / T),
          ty = Math.floor((P.y + P.h - 1) / T);
        const below = W.tile(tx, ty + 1);
        if ((below === 1 || below === 2 || below === 3) && game && game.save) {
          const sd = game.saveData;
          if (!sd || sd.room !== W.id || sd.tx !== tx || sd.ty !== ty) game.save(W.id, tx, ty);
        }
      }
      wasGround = P.onGround;
    };
    // 上の画面から落ちてきた
    if (opts && opts.enter && opts.enter.dir === 'down' && game && game.flags) {
      const max = game.flags.towerMax || 0;
      if (max > k * 28 + 12) {
        const i = (game.flags.fallLine = ((game.flags.fallLine || 0) + 1) % FALL_LINES.length);
        W.say(FALL_LINES[i], 240, 60, 150, { plain: true, size: 12, color: '#ffe9a8' });
      }
    }
  }

  const bgOf = (k) => (k <= 3 ? 'day' : k <= 6 ? 'dusk' : 'night');
  const room = (k, o) => {
    R['10-' + k] = Object.assign(
      {
        area: 10,
        theme: 'sky',
        bg: bgOf(k),
        exits: k === 1 ? { up: '10-2' } : { up: k === 8 ? '10-T' : '10-' + (k + 1), down: '10-' + (k - 1) },
        goal: 'up',
        drawFg(ctx, W) {
          G.Render.drawHeight(ctx, W);
          if (o.fg) o.fg(ctx, W);
        },
      },
      o
    );
  };

  room(1, {
    hint: '着地した場所に自動でセーブされる。落ちたらそこからやり直し。',
    name: '10-1 塔のふもと',
    map: towerMap({ floor: true, plats: [[5, 2, 10], [9, 2, 8], [13, 2, 6], [17, 2, 4], [20, 2, 2]], marks: [[3, 11, '@'], [20, 1, 'T']] }),
    setup(W, opts) {
      tower(W, 1, opts);
      W.sign(5, 11, 'ここから天まで、まっすぐ上へ。\n落ちたら、落ちた場所からやり直し。', { range: 40 });
      W.door(1, 10, { to: '9-X', spawn: [18, 11], label: '←' });
      W.decor(200, 216, 'pot');
    },
  });

  room(2, {
    hint: '1マスの足場は乗ると崩れる。止まらずに次へ。',
    name: '10-2 崩れる足場',
    map: towerMap({ plats: [[19, 3, 11, '-'], [15, 1, 9, 'B'], [11, 2, 7], [7, 1, 5], [3, 2, 3], [6, 2, 1]], marks: [[20, 10, 'E'], [6, 0, 'T']] }),
    setup(W, opts) {
      tower(W, 2, opts);
      const b = W.tileToBlock(15, 9, { keep: true });
      b.onStep = () => b.crumble(18);
    },
  });

  room(3, {
    hint: '空中では風に流される。風がやんでから跳ぼう。',
    name: '10-3 風の階',
    map: towerMap({ plats: [[5, 3, 11, '-'], [9, 2, 9], [13, 1, 7], [17, 2, 6], [20, 2, 4], [16, 1, 2], [12, 2, 1]], marks: [[6, 10, 'E'], [12, 0, 'T']] }),
    setup(W, opts) {
      tower(W, 3, opts);
      W.windAir = true;
      W.run(function* () {
        yield 40;
        for (;;) {
          W.vars.windWarn = 1;
          yield 40;
          W.vars.windWarn = 0;
          W.windX = -1.1;
          yield 70;
          W.windX = 0;
          yield 110;
        }
      });
    },
    fg(ctx, W) {
      G.Render.drawTowerWind(ctx, W);
    },
  });

  room(4, {
    hint: '動く足場が近くに来た時に乗り移ろう。',
    name: '10-4 動く足場',
    map: towerMap({ plats: [[11, 3, 11, '-'], [2, 2, 5], [6, 1, 3], [10, 2, 1]], marks: [[12, 10, 'E'], [10, 0, 'T']] }),
    setup(W, opts) {
      tower(W, 4, opts);
      const m = W.block(3, 8, 3, 1, { oneway: true, code: 3, keep: true });
      W.run(function* () {
        for (;;) {
          m.tweenTo(200, m.y, 110, 'inOutQuad');
          yield 130;
          m.tweenTo(60, m.y, 110, 'inOutQuad');
          yield 130;
        }
      });
    },
  });

  room(5, {
    hint: 'ジャンプ台で上のすり抜け足場まで飛ぼう。',
    name: '10-5 ジャンプ台',
    map: towerMap({ plats: [[9, 3, 11, '-'], [12, 2, 11], [12, 3, 3, '-'], [16, 1, 1]], marks: [[10, 10, 'E'], [16, 0, 'T']] }),
    setup(W, opts) {
      tower(W, 5, opts);
      W.spring(13, 10, { power: 7.4 });
      W.sign(9, 10, 'このジャンプ台は\n本当に安全です', { range: 30 });
    },
  });

  room(6, {
    hint: '空気が薄くて体がふわふわする。1マスの足場には横から乗ろう。',
    name: '10-6 空気が薄い',
    map: towerMap({ plats: [[15, 3, 11, '-'], [12, 1, 8], [8, 1, 5], [12, 1, 2]], marks: [[16, 10, 'E'], [12, 1, 'T']] }),
    setup(W, opts) {
      tower(W, 6, opts);
      W.gravScale = 0.65;
      W.say('空気が薄い……', 240, 40, 80, { plain: true, size: 10, color: '#c8d4f0' });
    },
  });

  room(7, {
    hint: '「近道」は罠（塔のふもとへ戻される）。右の足場を登ろう。',
    name: '10-7 近道あります',
    map: towerMap({ plats: [[11, 3, 11, '-'], [7, 2, 9, 'F'], [2, 3, 9], [16, 2, 9], [20, 2, 7], [16, 1, 5], [12, 2, 3], [16, 2, 1]], marks: [[12, 10, 'E'], [16, 0, 'T']] }),
    setup(W, opts) {
      tower(W, 7, opts);
      W.door(3, 7, { to: '10-1', spawn: [3, 11], label: '近道' });
      W.sign(10, 10, '← 近道\n（頂上まで一瞬）', { range: 30 });
    },
  });

  room(8, {
    hint: 'あと少し。1マスの足場は2段ジャンプで横から。',
    name: '10-8 あと少し',
    map: towerMap({ ceilHole: [11, 13], plats: [[15, 3, 11, '-'], [11, 1, 8], [7, 1, 5], [11, 1, 2]], marks: [[16, 10, 'E'], [11, 1, 'T']] }),
    setup(W, opts) {
      tower(W, 8, opts);
    },
  });

  // 頂上
  R['10-T'] = {
    hint: '頂上の木に近づこう。',
    area: 10,
    name: '10-T てっぺん',
    theme: 'sky',
    bg: 'space',
    music: 'ending',
    exits: { down: '10-8' },
    goal: 'flag',
    map: towerMap({ floor: 'low', floorHole: [11, 13] }),
    drawFg(ctx, W) {
      G.Render.drawHeight(ctx, W);
    },
    setup(W, opts) {
      tower(W, 9, opts);
      W.decor(360, 120, 'appletree', { h: 140 });
      W.add(new G.Moon(W, 90, 120, { r: 16, hazard: false, keep: true, face: 'calm' }));
      const sun = W.add(new G.Moon(W, 150, 70, { r: 14, hazard: false, keep: true, face: 'calm' }));
      sun.sunny = true;
      W.text(240, 40, 'てっぺん', { size: 16, color: '#ffe9a8' });
      // 5面クリア後：てっぺんの先、宇宙への扉が開く（6面へ）
      W.openNext = (fx) => {
        W.inputLock = 0;
        W.door(3, 11, { to: '11-1', spawn: [2, 11], label: '宇' });
        W.sign(5, 12, '宇宙への扉\n（STAGE 6）', { range: 30 });
        if (fx) W.after(30, () => W.say('……あれ？ あんな所に扉が。\nぼくも一緒に行くよ。', 90, 96, 150, {}));
      };
      if (W.game && W.game.flags.stage5Clear) {
        W.openNext(false);
        return;
      }
      W.trigPx(330, 0, 100, 280, () => {
        W.run(function* () {
          const P = W.player;
          W.inputLock = 600;
          W.say('よくぞ登ってきたね。', 90, 96, 90, {});
          yield 90;
          W.say('ここが世界でいちばん高い場所。\nリンゴの木の、ふるさとだよ。', 150, 48, 110, {});
          yield 110;
          // 最後のリンゴ
          const a = W.fruit(P.cx, -10, { kind: 'gold', r: 6, keep: true });
          a.hazard = false;
          a.vel(0, 2, 0, 0.15);
          yield () => a.cy >= P.y - 4;
          a.vel(-1.4, -3, 0, 0.2);
          G.sfx('bonk');
          W.say('コツン', P.cx, P.y - 6, 60, { plain: true, size: 10, color: '#ffffff' });
          yield 60;
          W.say('……今度は、死ななかった。', P.cx, P.y - 10, 90, {});
          G.sfx('fanfare');
          yield 120;
          W.vars.goal = true;
          if (W.game && W.game.stageClear) W.game.stageClear();
        });
      }, { cond: (P) => P.onGround });
    },
  };
})();
