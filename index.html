<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>I WANNA KILL THE MOON</title>

<style>
/* 夜空の黒 + 月の金 + 血の赤で統一したアーケード筐体風の単一テーマ */
:root {
  color-scheme: dark;
  --bg: #07040e;
  --ink: #f4ecff;
  --gold: #ffcf4a;
  --blood: #ff2a48;
  --btn: rgba(255, 255, 255, 0.1);
  --btn-edge: rgba(255, 255, 255, 0.32);
  --btn-on: rgba(255, 207, 74, 0.5);
  --btn-on-edge: rgba(255, 233, 168, 0.95);
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", monospace;
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
}
html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font);
}
#app {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 120%, #1a1240 0%, var(--bg) 60%);
}
#screen {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#pad {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
#pad.hidden,
#pad.off {
  opacity: 0;
}
.btn {
  position: absolute;
  box-sizing: border-box;
  border-radius: 50%;
  background: var(--btn);
  border: 2px solid var(--btn-edge);
  color: rgba(255, 255, 255, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  letter-spacing: 0.04em;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
  transition: background 0.06s, transform 0.06s, border-color 0.06s;
}
.btn.on {
  background: var(--btn-on);
  border-color: var(--btn-on-edge);
  transform: scale(0.94);
}
.btn.move {
  border-radius: 30%;
}
.btn.big {
  border-width: 3px;
}
.btn.sys {
  border-radius: 30%;
  background: rgba(10, 6, 18, 0.55);
}
#pad.portrait .btn {
  background: rgba(255, 255, 255, 0.07);
}
#pad.portrait .btn.on {
  background: var(--btn-on);
}
@media (prefers-reduced-motion: reduce) {
  .btn,
  #pad {
    transition: none;
  }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="screen" aria-label="ゲーム画面"></canvas>
  <div id="pad" class="hidden off">
    <div class="btn move" id="b-left"><span>◀</span></div>
    <div class="btn move" id="b-right"><span>▶</span></div>
    <div class="btn act" id="b-shoot"><span>SHOT</span></div>
    <div class="btn act big" id="b-jump"><span>JUMP</span></div>
    <div class="btn sys" id="b-retry"><span>↺</span></div>
    <div class="btn sys" id="b-pause"><span>II</span></div>
  </div>
</div>
<script>
// 共通ユーティリティ・定数（DOM非依存：ヘッドレス検証でも読み込む）
(function () {
  'use strict';
  const G = (globalThis.G = globalThis.G || {});

  G.T = 20; // タイルサイズ(px)
  G.COLS = 24;
  G.ROWS = 14;
  G.W = G.T * G.COLS; // 480
  G.H = G.T * G.ROWS; // 280

  // プレイヤー物理（60fps 固定ステップ）
  G.PHYS = {
    RUN: 1.7,
    GRAV: 0.18,
    JUMP: 4.6,
    DJUMP: 3.9,
    MAXFALL: 5.2,
    CUT: 0.45, // ジャンプボタンを離した時の上昇速度倍率
    COYOTE: 5, // 足場から離れた後でも地上ジャンプできる猶予
    BUFFER: 6, // 着地直前の先行入力猶予
    PW: 8,
    PH: 14,
  };

  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.approach = (v, t, s) => (v < t ? Math.min(v + s, t) : Math.max(v - s, t));

  G.overlap = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  G.rectCircle = (r, cx, cy, rad) => {
    const nx = G.clamp(cx, r.x, r.x + r.w);
    const ny = G.clamp(cy, r.y, r.y + r.h);
    const dx = cx - nx,
      dy = cy - ny;
    return dx * dx + dy * dy < rad * rad;
  };

  // 矩形と三角形の分離軸判定。pts = [x0,y0,x1,y1,x2,y2]
  G.rectTri = (r, p) => {
    const rx0 = r.x,
      ry0 = r.y,
      rx1 = r.x + r.w,
      ry1 = r.y + r.h;
    const minX = Math.min(p[0], p[2], p[4]),
      maxX = Math.max(p[0], p[2], p[4]);
    const minY = Math.min(p[1], p[3], p[5]),
      maxY = Math.max(p[1], p[3], p[5]);
    if (maxX <= rx0 || minX >= rx1 || maxY <= ry0 || minY >= ry1) return false;
    for (let i = 0; i < 3; i++) {
      const ax = p[i * 2],
        ay = p[i * 2 + 1];
      const bx = p[((i + 1) % 3) * 2],
        by = p[((i + 1) % 3) * 2 + 1];
      const nx = by - ay,
        ny = ax - bx; // 辺の法線
      let tMin = Infinity,
        tMax = -Infinity;
      for (let j = 0; j < 3; j++) {
        const d = p[j * 2] * nx + p[j * 2 + 1] * ny;
        if (d < tMin) tMin = d;
        if (d > tMax) tMax = d;
      }
      const c = [rx0 * nx + ry0 * ny, rx1 * nx + ry0 * ny, rx0 * nx + ry1 * ny, rx1 * nx + ry1 * ny];
      const rMin = Math.min(c[0], c[1], c[2], c[3]),
        rMax = Math.max(c[0], c[1], c[2], c[3]);
      if (rMax <= tMin || rMin >= tMax) return false;
    }
    return true;
  };

  // トゲの三角形（inset で少し小さくして理不尽さを和らげる）
  G.spikeTri = (x, y, w, h, dir, inset) => {
    const i = inset == null ? 1.5 : inset;
    switch (dir) {
      case 'u':
        return [x + i, y + h, x + w - i, y + h, x + w / 2, y + i * 1.6];
      case 'd':
        return [x + i, y, x + w - i, y, x + w / 2, y + h - i * 1.6];
      case 'l':
        return [x + w, y + i, x + w, y + h - i, x + i * 1.6, y + h / 2];
      default:
        return [x, y + i, x, y + h - i, x + w - i * 1.6, y + h / 2];
    }
  };

  // 決定論的乱数（mulberry32）
  G.RNG = class {
    constructor(seed) {
      this.s = seed >>> 0 || 1;
    }
    next() {
      let t = (this.s += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    range(a, b) {
      return a + (b - a) * this.next();
    }
    int(a, b) {
      return Math.floor(this.range(a, b + 1));
    }
    pick(arr) {
      return arr[Math.floor(this.next() * arr.length)];
    }
    chance(p) {
      return this.next() < p;
    }
  };
  // 演出用（シミュレーション結果に影響しない）乱数
  G.fx = new G.RNG(12345);

  G.ease = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => t * (2 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
    inCubic: (t) => t * t * t,
    outCubic: (t) => --t * t * t + 1,
    outBack: (t) => {
      const c = 1.70158;
      return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
    },
    outBounce: (t) => {
      const n = 7.5625,
        d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
      return n * (t -= 2.625 / d) * t + 0.984375;
    },
  };

  // 効果音・振動などのフック（ブラウザ側で差し替える）
  G.sfx = G.sfx || function () {};
  G.music = G.music || function () {};
  G.vibrate = G.vibrate || function () {};

  G.fmtTime = (frames) => {
    const s = Math.floor(frames / 60);
    const h = Math.floor(s / 3600),
      m = Math.floor((s % 3600) / 60),
      sec = s % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  };
})();

</script>
<script>
// ワールド（部屋）・プレイヤー・エンティティ基底・弾・パーティクル
// DOM非依存。描画は render.js / entities.js の draw() が担当する。
(function () {
  'use strict';
  const G = globalThis.G;
  const { T, COLS, ROWS, PHYS } = G;
  const SW = G.W,
    SH = G.H;

  const TILE = { EMPTY: 0, SOLID: 1, ALT: 2, PLAT: 3, SU: 10, SD: 11, SL: 12, SR: 13 };
  G.TILE = TILE;
  // F は「見た目は地面、実はすり抜ける」偽ブロック
  const CHARS = { '#': 1, B: 2, '-': 3, F: 4, '^': 10, v: 11, '<': 12, '>': 13 };
  const SPIKE_DIR = { 10: 'u', 11: 'd', 12: 'l', 13: 'r' };
  G.SPIKE_DIR = SPIKE_DIR;
  const isSolidCode = (c) => c === 1 || c === 2;
  G.isSolidCode = isSolidCode;

  function strHash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // ------------------------------------------------------------------
  // エンティティ基底
  // ------------------------------------------------------------------
  class Ent {
    constructor(W, x, y, w, h) {
      this.W = W;
      this.x = x;
      this.y = y;
      this.w = w;
      this.h = h;
      this.vx = 0;
      this.vy = 0;
      this.ax = 0;
      this.ay = 0;
      this.xr = 0;
      this.yr = 0;
      this.maxV = 99;
      this.alive = true;
      this.visible = true;
      this.layer = 0;
      this.solid = false;
      this.oneway = false;
      this.collidable = true;
      this.hazard = false;
      this.shootable = false;
      this.cause = null;
      this.t = 0;
      this.tw = null;
      this.ridden = false;
      this.offscreenKill = false;
    }
    get cx() {
      return this.x + this.w / 2;
    }
    get cy() {
      return this.y + this.h / 2;
    }
    update() {
      this.t++;
      if (this.tick) this.tick();
      if (!this.alive) return;
      let dx = 0,
        dy = 0;
      if (this.tw) {
        const tw = this.tw;
        tw.t++;
        const k = tw.e(Math.min(1, tw.t / tw.d));
        const nx = tw.x0 + (tw.x1 - tw.x0) * k;
        const ny = tw.y0 + (tw.y1 - tw.y0) * k;
        dx = nx - (this.x + this.xr);
        dy = ny - (this.y + this.yr);
        if (tw.t >= tw.d) {
          this.tw = null;
          if (tw.then) tw.then.call(this);
        }
      } else {
        this.vx += this.ax;
        this.vy += this.ay;
        if (this.vx > this.maxV) this.vx = this.maxV;
        if (this.vx < -this.maxV) this.vx = -this.maxV;
        if (this.vy > this.maxV) this.vy = this.maxV;
        if (this.vy < -this.maxV) this.vy = -this.maxV;
        dx = this.vx;
        dy = this.vy;
      }
      if (dx || dy) this.move(dx, dy);
      if (this.solid && this.collidable) {
        const P = this.W.player;
        if (P.alive && P.isRiding(this)) {
          if (!this.ridden) {
            this.ridden = true;
            if (this.onStep) this.onStep(P);
          }
          this.rideT = (this.rideT || 0) + 1;
        } else {
          this.ridden = false;
          this.rideT = 0;
        }
      }
      if (this.offscreenKill) {
        const m = this.offscreenKill === true ? 80 : this.offscreenKill;
        if (this.x > SW + m || this.x + this.w < -m || this.y > SH + m || this.y + this.h < -m - 200)
          this.alive = false;
      }
    }
    move(dx, dy) {
      if (this.solid) this.solidMove(dx, dy);
      else {
        this.x += dx;
        this.y += dy;
      }
    }
    // Celeste 方式のソリッド移動：乗っているプレイヤーを運び、重なれば押し出す
    solidMove(dx, dy) {
      const W = this.W,
        P = W.player;
      this.xr += dx;
      this.yr += dy;
      const mx = Math.round(this.xr),
        my = Math.round(this.yr);
      if (!mx && !my) return;
      const riding = P.alive && this.collidable && P.isRiding(this);
      const wasCol = this.collidable;
      if (mx) {
        this.xr -= mx;
        this.x += mx;
        if (wasCol && P.alive) {
          this.collidable = false;
          if (!this.oneway && G.overlap(P, this)) {
            const amt = mx > 0 ? this.x + this.w - P.x : this.x - (P.x + P.w);
            P.moveX(amt, () => P.squish(this));
          } else if (riding) P.moveX(mx);
          this.collidable = wasCol;
        }
      }
      if (my) {
        this.yr -= my;
        const oldTop = this.y;
        this.y += my;
        if (wasCol && P.alive) {
          this.collidable = false;
          if (this.oneway) {
            // 上昇する一方通行足場：足元を通過したら持ち上げる
            const g = W.gravity;
            const xo = P.x + P.w > this.x && P.x < this.x + this.w;
            if (g === 1 && xo) {
              const feet = P.y + P.h;
              if (riding) P.moveY(my, () => (my < 0 ? P.squish(this) : null));
              else if (my < 0 && feet > this.y && feet <= oldTop) P.moveY(this.y - feet, () => P.squish(this));
            }
          } else if (G.overlap(P, this)) {
            const amt = my > 0 ? this.y + this.h - P.y : this.y - (P.y + P.h);
            P.moveY(amt, () => P.squish(this));
            if (my > 0 && W.gravity === 1 && P.vy < 0) P.vy = 0;
          } else if (riding) P.moveY(my);
          this.collidable = wasCol;
        }
      }
    }
    tweenTo(x, y, d, ease, then) {
      this.tw = {
        x0: this.x + this.xr,
        y0: this.y + this.yr,
        x1: x,
        y1: y,
        t: 0,
        d: Math.max(1, d),
        e: G.ease[ease || 'inOutQuad'],
        then,
      };
      this.vx = this.vy = this.ax = this.ay = 0;
      return this;
    }
    tweenBy(dx, dy, d, ease, then) {
      return this.tweenTo(this.x + this.xr + dx, this.y + this.yr + dy, d, ease, then);
    }
    stop() {
      this.vx = this.vy = this.ax = this.ay = 0;
      this.tw = null;
      return this;
    }
    vel(vx, vy, ax, ay) {
      this.tw = null;
      this.vx = vx || 0;
      this.vy = vy || 0;
      this.ax = ax || 0;
      this.ay = ay || 0;
      return this;
    }
    kill() {
      this.alive = false;
    }
    hits(r) {
      return G.overlap(r, this.hitbox ? this.hitbox() : this);
    }
    draw() {}
  }
  G.Ent = Ent;

  // ------------------------------------------------------------------
  // プレイヤー
  // ------------------------------------------------------------------
  class Player {
    constructor(W, x, y) {
      this.W = W;
      this.x = Math.round(x);
      this.y = Math.round(y);
      this.w = PHYS.PW;
      this.h = PHYS.PH;
      this.xr = 0;
      this.yr = 0;
      this.vx = 0;
      this.vy = 0;
      this.face = 1;
      this.alive = true;
      this.djump = true;
      this.coyote = 0;
      this.jbuf = 0;
      this.onGround = false;
      this.shootCd = 0;
      this.runT = 0;
      this.landT = 0;
      this.jumpHeld = false;
      this.extVX = 0;
    }
    get cx() {
      return this.x + this.w / 2;
    }
    get cy() {
      return this.y + this.h / 2;
    }
    collideAt(x, y) {
      const r = this.W.solidAt(x, y, this.w, this.h);
      if (r && r !== true && r.invisible) r.reveal();
      return r;
    }
    onewayAt(dir) {
      const g = this.W.gravity;
      if (dir !== g) return false;
      return this.W.onewayAt(this.x, this.w, g === 1 ? this.y + this.h : this.y, g);
    }
    moveX(amt, onCol) {
      this.xr += amt;
      let m = Math.round(this.xr);
      if (!m) return false;
      this.xr -= m;
      const s = Math.sign(m);
      while (m) {
        if (!this.collideAt(this.x + s, this.y)) {
          this.x += s;
          m -= s;
        } else {
          this.xr = 0;
          if (onCol) onCol();
          return true;
        }
      }
      return false;
    }
    moveY(amt, onCol) {
      this.yr += amt;
      let m = Math.round(this.yr);
      if (!m) return false;
      this.yr -= m;
      const s = Math.sign(m);
      while (m) {
        const hit = this.collideAt(this.x, this.y + s) || this.onewayAt(s);
        if (!hit) {
          this.y += s;
          m -= s;
        } else {
          this.yr = 0;
          if (hit !== true && hit.onBonk && s === -this.W.gravity) hit.onBonk(this);
          if (onCol) onCol();
          return true;
        }
      }
      return false;
    }
    isRiding(e) {
      if (this.x + this.w <= e.x || this.x >= e.x + e.w) return false;
      return this.W.gravity === 1 ? this.y + this.h === e.y : this.y === e.y + e.h;
    }
    grounded() {
      const g = this.W.gravity;
      return !!(this.collideAt(this.x, this.y + g) || this.onewayAt(g));
    }
    squish(by) {
      this.W.kill((by && by.squishCause) || '圧死。ぺちゃんこ。');
    }
    hitbox() {
      return { x: this.x, y: this.y, w: this.w, h: this.h };
    }
    update(inp) {
      if (!this.alive) return;
      const W = this.W,
        g = W.gravity;
      const lock = W.inputLock > 0;
      const L = !lock && inp.left,
        R = !lock && inp.right;
      const jP = !lock && inp.jumpP,
        jR = lock || inp.jumpR,
        jH = !lock && inp.jump;
      let dir = (R ? 1 : 0) - (L ? 1 : 0);
      if (W.reverse) dir = -dir;
      if (dir) this.face = dir;

      const wasGround = this.onGround;
      this.onGround = this.grounded();
      if (this.onGround) {
        this.coyote = PHYS.COYOTE;
        this.djump = true;
        if (!wasGround && this.vy * g >= 0) {
          this.landT = 6;
          W.dust(this.cx, g === 1 ? this.y + this.h : this.y, 3);
        }
      } else if (this.coyote > 0) this.coyote--;

      if (jP) this.jbuf = PHYS.BUFFER;
      let jumpedNow = false;
      if (this.jbuf > 0) {
        if (this.coyote > 0) {
          this.vy = -PHYS.JUMP * g;
          this.coyote = 0;
          this.jbuf = 0;
          this.onGround = false;
          jumpedNow = true;
          G.sfx('jump');
        } else if (this.djump) {
          this.vy = -PHYS.DJUMP * g;
          this.djump = false;
          this.jbuf = 0;
          jumpedNow = true;
          G.sfx('djump');
          W.puff(this.cx, g === 1 ? this.y + this.h : this.y);
        } else this.jbuf--;
        // 先行入力で跳んだ時、既にボタンを離していれば小ジャンプ
        if (jumpedNow && !jH) this.vy *= PHYS.CUT;
      }
      if (jR && !jumpedNow && this.vy * g < 0) this.vy *= PHYS.CUT;

      if (this.onGround && this.vy * g >= 0) {
        this.vy = 0;
      } else {
        this.vy += PHYS.GRAV * g * (W.gravScale || 1);
        if (this.vy * g > PHYS.MAXFALL) this.vy = PHYS.MAXFALL * g;
      }

      // 足場の影響（ベルトコンベア等）
      // windAir の時は空中にいる間だけ風に流される（砂嵐）
      let ex = W.windAir && this.onGround ? 0 : W.windX || 0;
      if (this.onGround) {
        for (const e of W.ents) {
          if (e.alive && e.solid && e.conveyor && e.collidable && this.isRiding(e)) {
            ex += e.conveyor;
            break;
          }
        }
      }
      this.vx = dir * PHYS.RUN;
      this.moveX(this.vx + ex);
      this.moveY(this.vy, () => {
        if (this.vy * g < 0) G.sfx('bonk');
        this.vy = 0;
      });

      if (dir && this.onGround) this.runT++;
      else this.runT = 0;
      if (this.landT > 0) this.landT--;

      // ショット（押しっぱなしで連射）
      if (this.shootCd > 0) this.shootCd--;
      const sP = !lock && inp.shootP,
        sH = !lock && (inp.shoot || (W.autoFire && G.autoShot));
      if (!W.noShoot && (sP || (sH && this.shootCd <= 0))) {
        if (W.bullets.filter((b) => !b.hostile).length < 4) {
          W.bullets.push(new Bullet(W, this.cx + this.face * 5, this.y + (g === 1 ? 7 : 6), this.face));
          G.sfx('shoot');
          this.shootCd = 9;
        }
      }
      this.jumpHeld = jH;
    }
  }
  G.Player = Player;

  // ------------------------------------------------------------------
  // 弾
  // ------------------------------------------------------------------
  class Bullet {
    constructor(W, x, y, dir) {
      this.W = W;
      this.x = x;
      this.y = y;
      this.vx = 6 * dir;
      this.vy = 0;
      this.life = 46;
      this.alive = true;
      this.hostile = false;
      this.t = 0;
    }
    box() {
      return { x: this.x - 2, y: this.y - 2, w: 4, h: 4 };
    }
    update() {
      const W = this.W;
      this.t++;
      // 高速なので2分割で判定
      for (let k = 0; k < 2 && this.alive; k++) {
        this.x += this.vx / 2;
        this.y += this.vy / 2;
        if (this.x < -10 || this.x > SW + 10 || this.y < -10 || this.y > SH + 10) {
          this.alive = false;
          return;
        }
        const hit = W.pointSolid(this.x, this.y);
        if (hit) {
          if (hit !== true && hit.invisible) hit.reveal();
          if (hit !== true && hit.onShot && hit.shootable) {
            if (hit.onShot(this) !== false) this.alive = false;
          } else this.alive = false;
          if (!this.alive) W.spark(this.x, this.y);
          return;
        }
        const b = this.box();
        for (const e of W.ents) {
          if (!e.alive || !e.shootable) continue;
          const sb = e.shotBox ? e.shotBox() : e;
          if (G.overlap(b, sb)) {
            if (e.onShot(this) !== false) {
              this.alive = false;
              return;
            }
          }
        }
        if (this.hostile && W.player.alive && this.t > 3 && G.overlap(b, W.player)) {
          W.kill(this.cause || '自分の弾で死んだ。反射には気をつけよう。');
          this.alive = false;
          return;
        }
      }
      if (--this.life <= 0) this.alive = false;
    }
  }
  G.Bullet = Bullet;

  // ------------------------------------------------------------------
  // ワールド（1画面＝1部屋）
  // ------------------------------------------------------------------
  class World {
    constructor(game, id, opts) {
      opts = opts || {};
      const def = G.ROOMS[id];
      if (!def) throw new Error('room not found: ' + id);
      this.game = game;
      this.id = id;
      this.def = def;
      this.opts = opts;
      this.theme = def.theme || 'grass';
      this.exits = Object.assign({}, def.exits || {});
      this.easy = !!(game && game.diff === 'easy');
      this.rng = new G.RNG(strHash(id) ^ (opts.seed || 0));
      this.time = 0;
      this.ents = [];
      this.cos = [];
      this.triggers = [];
      this.bullets = [];
      this.particles = [];
      this.texts = [];
      this.gravity = 1;
      this.gravScale = 1;
      this.windX = 0;
      this.reverse = false;
      this.inputLock = 0;
      this.noShoot = false;
      this.shake = 0;
      this.flash = 0;
      this.flashColor = '#ffffff';
      this.dark = 0;
      this.tilesDirty = true;
      this.vars = {};
      this.god = !!G.god;
      this.lives = null; // ボス戦の残機（やさしいモードのみ）
      this.invuln = 0;
      this.marksMap = {};
      this.spawnPoint = null;
      this.parse(def.map);

      let px, py, face = 1;
      if (opts.enter) {
        px = opts.enter.x;
        py = opts.enter.y;
        face = opts.enter.face;
      } else if (opts.spawn) {
        px = opts.spawn.x;
        py = opts.spawn.y;
        face = opts.spawn.face || 1;
      } else {
        const m = this.mark('@') || { x: T, y: (ROWS - 3) * T };
        px = m.x + (T - PHYS.PW) / 2;
        py = m.y + T - PHYS.PH;
      }
      this.player = new Player(this, px, py);
      this.player.face = face;
      if (opts.enter) {
        const e = opts.enter;
        this.player.vy = e.vy;
        this.player.djump = e.djump;
        this.player.xr = e.xr || 0;
        this.player.yr = e.yr || 0;
        this.player.jumpHeld = e.jumpHeld;
      }
      if (def.setup) def.setup(this, opts);
      if (opts.enter) this.unstick(opts.enter.dir);
    }

    // 画面移動の直後に壁や床に埋まっていたら、いちばん近い空いている場所へ押し出す
    unstick(dir) {
      const P = this.player;
      if (!this.solidAt(P.x, P.y, P.w, P.h)) return false;
      // 進んできた向きへの押し出しと、上（床の上に立てる方向）を少し優先する
      const fwd = { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1] }[dir] || [0, -1];
      let best = null,
        bc = Infinity;
      for (let dy = -100; dy <= 100; dy++) {
        for (let dx = -100; dx <= 100; dx++) {
          const x = P.x + dx,
            y = P.y + dy;
          if (x < -P.w / 2 + 1 || x > SW - P.w / 2 - 1 || y < -P.h / 2 || y > SH - P.h) continue;
          let c = Math.abs(dx) + Math.abs(dy);
          if (dx * fwd[0] + dy * fwd[1] < 0) c += 6;
          if (dy > 0) c += dy * 0.5;
          if (c >= bc) continue;
          const r = { x, y, w: P.w, h: P.h };
          if (this.solidAt(x, y, P.w, P.h) || this.tileHazard(r)) continue;
          best = [x, y];
          bc = c;
        }
      }
      if (!best) return false;
      if (best[1] < P.y) P.vy = Math.min(P.vy, 0);
      P.x = best[0];
      P.y = best[1];
      P.xr = P.yr = 0;
      return true;
    }

    parse(map) {
      if (!map || map.length !== ROWS) throw new Error(`${this.id}: map rows ${map && map.length}`);
      this.tiles = new Uint8Array(COLS * ROWS);
      for (let ty = 0; ty < ROWS; ty++) {
        const row = map[ty];
        if (row.length !== COLS) throw new Error(`${this.id}: row ${ty} has ${row.length} cols`);
        for (let tx = 0; tx < COLS; tx++) {
          const ch = row[tx];
          const code = CHARS[ch];
          if (code) this.tiles[ty * COLS + tx] = code;
          else if (ch !== '.' && ch !== ' ') {
            (this.marksMap[ch] = this.marksMap[ch] || []).push({ tx, ty, x: tx * T, y: ty * T });
          }
        }
      }
      for (const m of this.marksMap.S || []) this.add(new G.SavePoint(this, m.tx, m.ty));
      if (this.easy) for (const m of this.marksMap.s || []) this.add(new G.SavePoint(this, m.tx, m.ty, { easy: true }));
    }
    // 難易度の途中変更：やさしい時だけのセーブを出し入れし、ボス戦中なら残機も切り替える
    setEasy(on) {
      this.easy = on;
      if (on) {
        for (const m of this.marksMap.s || [])
          if (!this.ents.some((e) => e.alive && e instanceof G.SavePoint && e.easy && e.x === m.x && e.y === m.y)) this.add(new G.SavePoint(this, m.tx, m.ty, { easy: true }));
      } else for (const e of this.ents) if (e instanceof G.SavePoint && e.easy) e.alive = false;
      if (this.boss && this.boss.showBar && !this.boss.defeated) this.lives = on ? Math.max(this.lives || 0, 3) : null;
    }
    mark(ch) {
      const a = this.marksMap[ch];
      return a ? a[0] : null;
    }
    marks(ch) {
      return this.marksMap[ch] || [];
    }

    // ---- タイル ----
    tile(tx, ty) {
      if (tx < 0) return this.exits.left ? 0 : 1;
      if (tx >= COLS) return this.exits.right ? 0 : 1;
      if (ty < 0) return this.exits.up ? 0 : 1;
      if (ty >= ROWS) return 0;
      return this.tiles[ty * COLS + tx];
    }
    setTile(tx, ty, code) {
      if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
      this.tiles[ty * COLS + tx] = code;
      this.tilesDirty = true;
    }
    solidAt(x, y, w, h) {
      const tx0 = Math.floor(x / T),
        tx1 = Math.floor((x + w - 0.001) / T);
      const ty0 = Math.floor(y / T),
        ty1 = Math.floor((y + h - 0.001) / T);
      for (let ty = ty0; ty <= ty1; ty++)
        for (let tx = tx0; tx <= tx1; tx++) if (isSolidCode(this.tile(tx, ty))) return true;
      for (const e of this.ents) {
        if (e.solid && e.collidable && !e.oneway && e.alive && x < e.x + e.w && x + w > e.x && y < e.y + e.h && y + h > e.y)
          return e;
      }
      return false;
    }
    onewayAt(x, w, feet, g) {
      const tx0 = Math.floor(x / T),
        tx1 = Math.floor((x + w - 0.001) / T);
      if (feet % T === 0) {
        const ty = g === 1 ? feet / T : feet / T - 1;
        if (ty >= 0 && ty < ROWS)
          for (let tx = tx0; tx <= tx1; tx++) if (this.tile(tx, ty) === TILE.PLAT) return true;
      }
      for (const e of this.ents) {
        if (!e.alive || !e.oneway || !e.collidable) continue;
        if (x + w <= e.x || x >= e.x + e.w) continue;
        if (g === 1 ? e.y === feet : e.y + e.h === feet) return e;
      }
      return false;
    }
    pointSolid(x, y) {
      const tx = Math.floor(x / T),
        ty = Math.floor(y / T);
      if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS && isSolidCode(this.tiles[ty * COLS + tx])) return true;
      for (const e of this.ents) {
        if (e.alive && e.solid && !e.oneway && (e.collidable || e.invisible) && x >= e.x && x < e.x + e.w && y >= e.y && y < e.y + e.h)
          return e;
      }
      return false;
    }
    tileHazard(r) {
      const tx0 = Math.max(0, Math.floor(r.x / T)),
        tx1 = Math.min(COLS - 1, Math.floor((r.x + r.w - 0.001) / T));
      const ty0 = Math.max(0, Math.floor(r.y / T)),
        ty1 = Math.min(ROWS - 1, Math.floor((r.y + r.h - 0.001) / T));
      for (let ty = ty0; ty <= ty1; ty++)
        for (let tx = tx0; tx <= tx1; tx++) {
          const c = this.tiles[ty * COLS + tx];
          if (c >= 10 && G.rectTri(r, G.spikeTri(tx * T, ty * T, T, T, SPIKE_DIR[c]))) return true;
        }
      return false;
    }

    // ---- エンティティ・スクリプト ----
    add(e) {
      this.ents.push(e);
      return e;
    }
    run(gen, owner) {
      const co = { it: gen.call(this, this), wait: 0, owner, done: false };
      this.cos.push(co);
      return co;
    }
    after(frames, fn) {
      return this.run(function* () {
        yield frames;
        fn();
      });
    }
    trig(tx, ty, tw, th, fn, o) {
      return this.trigPx(tx * T, ty * T, tw * T, th * T, fn, o);
    }
    trigPx(x, y, w, h, fn, o) {
      o = o || {};
      const t = { x, y, w, h, fn, once: o.once !== false, cond: o.cond, done: false, inside: false, enterOnly: o.enter };
      this.triggers.push(t);
      return t;
    }
    stepCos() {
      for (let i = 0; i < this.cos.length; i++) {
        const c = this.cos[i];
        if (c.done) continue;
        if (c.owner && !c.owner.alive) {
          c.done = true;
          continue;
        }
        if (typeof c.wait === 'function') {
          if (!c.wait()) continue;
        } else if (c.wait > 0) {
          c.wait--;
          continue;
        }
        const r = c.it.next();
        if (r.done) c.done = true;
        else c.wait = r.value === undefined ? 0 : r.value;
      }
      if (this.cos.length > 32) this.cos = this.cos.filter((c) => !c.done);
    }

    kill(cause) {
      const P = this.player;
      if (!P.alive || this.god || this.invuln > 0) return;
      // やさしいモードのボス戦：残機があれば1つ減らして耐える
      if (this.lives != null && this.lives > 1) {
        this.lives--;
        this.invuln = 100;
        this.shake = 10;
        this.flash = 5;
        this.flashColor = '#ff6a8a';
        P.vy = -3.2 * this.gravity;
        P.djump = true;
        G.sfx('hurt');
        G.vibrate(30);
        this.say(`のこり ${this.lives}`, P.cx, P.y - 4, 60, { plain: true, size: 11, color: '#ff9aaa' });
        this.burst(P.cx, P.cy, 14, ['#ff6a8a', '#ffffff'], 2, { g: 0.05, life: 20 });
        return;
      }
      P.alive = false;
      this.deathCause = cause || 'トゲに刺さった。';
      this.blood(P.cx, P.cy);
      this.shake = 14;
      this.flash = 6;
      this.flashColor = '#ff2040';
      G.sfx('death');
      G.vibrate(60);
      if (this.onPlayerDeath) this.onPlayerDeath();
      if (this.game && this.game.onDeath) this.game.onDeath(this.deathCause);
    }

    step(inp) {
      this.time++;
      if (this.inputLock > 0) this.inputLock--;
      if (this.invuln > 0) this.invuln--;
      this.playerBlink = this.invuln > 0;
      this.stepCos();
      for (let i = 0; i < this.ents.length; i++) {
        const e = this.ents[i];
        if (e.alive) e.update();
      }
      const P = this.player;
      P.update(inp);
      for (const b of this.bullets) if (b.alive) b.update();
      if (P.alive) {
        for (const t of this.triggers) {
          if (t.done) continue;
          const inside = G.overlap(P, t);
          if (inside && (!t.enterOnly || !t.inside) && (!t.cond || t.cond(P))) {
            if (t.once) t.done = true;
            t.fn(P);
          }
          t.inside = inside;
        }
      }
      if (P.alive) {
        const r = P.hitbox();
        if (this.tileHazard(r)) this.kill(this.def.spikeCause || (this.def.spikeCauseFn && this.def.spikeCauseFn(this)) || G.pickSpikeCause(this));
        else {
          for (const e of this.ents) {
            if (e.alive && e.hazard && e.hits(r)) {
              this.kill(typeof e.cause === 'function' ? e.cause() : e.cause);
              break;
            }
          }
        }
      }
      if (P.alive) this.checkExits();
      if (this.ents.length > 8 && this.time % 30 === 0) this.ents = this.ents.filter((e) => e.alive);
      this.bullets = this.bullets.filter((b) => b.alive);
      if (this.onStep) this.onStep();
      this.updateParticles();
      if (this.shake > 0) this.shake--;
      if (this.flash > 0) this.flash--;
    }

    checkExits() {
      const P = this.player;
      const cx = P.x + P.w / 2,
        cy = P.y + P.h / 2;
      const go = (dir) => this.game && this.game.changeRoom && this.game.changeRoom(dir);
      if (cx >= SW && this.exits.right) return go('right');
      if (cx < 0 && this.exits.left) return go('left');
      if (cy < 0 && this.exits.up) return go('up');
      if (P.y >= SH) {
        if (this.exits.down) return go('down');
        this.kill(this.def.pitCause || '奈落へ落ちた。');
      }
      if (P.y + P.h <= -4 && this.gravity === -1 && !this.exits.up) this.kill('空へ落ちた。');
    }

    // ---- パーティクル（演出のみ。ヘッドレスでは無効） ----
    addP(p) {
      if (G.headless) return;
      if (this.particles.length > 600) this.particles.shift();
      this.particles.push(p);
    }
    blood(x, y) {
      if (G.headless) return;
      const R = G.fx;
      for (let i = 0; i < 90; i++) {
        const a = R.range(0, Math.PI * 2),
          s = R.range(0.5, 5.5);
        this.addP({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, g: 0.2, life: 400 + R.int(0, 200),
          c: R.chance(0.7) ? '#c8102e' : R.chance(0.5) ? '#ff3344' : '#7a0018', s: R.chance(0.3) ? 2 : 1, stick: true,
        });
      }
      for (let i = 0; i < 6; i++) {
        this.addP({ x, y, vx: R.range(-2, 2), vy: R.range(-4, -1), g: 0.25, life: 600, c: '#ffd6b0', s: 2, stick: true });
      }
    }
    dust(x, y, n) {
      if (G.headless) return;
      const R = G.fx;
      for (let i = 0; i < n; i++)
        this.addP({ x: x + R.range(-4, 4), y: y - 1, vx: R.range(-0.6, 0.6), vy: R.range(-0.6, -0.1), g: 0, life: 14, c: 'rgba(255,255,255,0.6)', s: 1, fade: true });
    }
    puff(x, y) {
      if (G.headless) return;
      const R = G.fx;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        this.addP({ x, y, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 0.5 + 0.3, g: 0, life: 16, c: 'rgba(200,230,255,0.8)', s: 1, fade: true });
      }
    }
    spark(x, y, c) {
      if (G.headless) return;
      const R = G.fx;
      for (let i = 0; i < 5; i++)
        this.addP({ x, y, vx: R.range(-1.5, 1.5), vy: R.range(-1.5, 1.5), g: 0, life: 10, c: c || '#fff6a0', s: 1, fade: true });
    }
    burst(x, y, n, colors, speed, opts) {
      if (G.headless) return;
      const R = G.fx;
      opts = opts || {};
      for (let i = 0; i < n; i++) {
        const a = R.range(0, Math.PI * 2),
          s = R.range(0.3, speed || 3);
        this.addP({
          x: x + R.range(-(opts.spread || 0), opts.spread || 0), y: y + R.range(-(opts.spread || 0), opts.spread || 0),
          vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opts.up || 0), g: opts.g == null ? 0.1 : opts.g,
          life: opts.life || R.int(20, 50), c: R.pick(colors), s: opts.size || R.int(1, 2), fade: opts.fade !== false, stick: opts.stick,
        });
      }
    }
    updateParticles() {
      const ps = this.particles;
      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        p.life--;
        if (p.life <= 0) {
          ps.splice(i, 1);
          continue;
        }
        if (p.stuck) continue;
        p.vy += p.g || 0;
        if (p.vy > 6) p.vy = 6;
        const nx = p.x + p.vx,
          ny = p.y + p.vy;
        if (p.stick) {
          const tx = Math.floor(nx / T),
            ty = Math.floor(ny / T);
          if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS && isSolidCode(this.tiles[ty * COLS + tx])) {
            p.stuck = true;
            continue;
          }
        }
        p.x = nx;
        p.y = ny;
        if (p.y > SH + 20) p.life = 0;
      }
    }

    // 画面テキスト（吹き出し等）
    say(text, x, y, frames, opts) {
      const t = Object.assign({ text, x, y, life: frames || 120, max: frames || 120 }, opts || {});
      this.texts.push(t);
      return t;
    }
  }
  G.World = World;

  G.SPIKE_CAUSES = [
    'トゲに刺さった。',
    'トゲは痛い。知ってた。',
    'トゲに触れてはいけない。',
    'トゲの先端は鋭い。',
    'トゲと仲良くなれなかった。',
    'トゲは裏切らない。',
    'またトゲか。',
    'そこにトゲがあった。',
    'トゲ「やあ」',
    'トゲの気持ちを考えたことはあるか。',
  ];
  G.pickSpikeCause = (W) => G.SPIKE_CAUSES[(W.time + (W.game ? W.game.deaths : 0)) % G.SPIKE_CAUSES.length];
})();

</script>
<script>
// エンティティ群とファクトリ。draw() はブラウザのみで呼ばれる（G.SPR を使用）
(function () {
  'use strict';
  const G = globalThis.G;
  const { T } = G;
  const SW = G.W,
    SH = G.H;
  const Ent = G.Ent;

  // ---------------- トゲ ----------------
  class Spike extends Ent {
    constructor(W, x, y, dir, o) {
      o = o || {};
      const s = o.size || T;
      super(W, x, y, s, s);
      this.dir = dir || 'u';
      this.hazard = true;
      this.cause = o.cause || null;
      this.ox = 0;
      this.oy = 0;
      this.pal = o.pal || W.def.spikePal || null;
      this.layer = 1;
      this.inset = o.inset;
      if (o.hidden) {
        // 地面に埋まっていて pop() で飛び出す
        this.layer = -1;
        const d = { u: [0, s], d: [0, -s], l: [s, 0], r: [-s, 0] }[this.dir];
        this.ox = d[0];
        this.oy = d[1];
        this.armed = false;
        this.hazard = false;
      }
      if (o.invisible) {
        this.visible = false;
        this.hazard = false;
      }
      this.popT = 0;
      this.offscreenKill = o.keep ? false : 200;
    }
    pop(frames, sound) {
      if (this.popped) return this;
      this.popped = true;
      this.hazard = true;
      this.visible = true;
      this.popT = this.popDur = frames || 3;
      this.popFrom = [this.ox, this.oy];
      if (sound !== false) G.sfx('pop');
      return this;
    }
    show() {
      this.visible = true;
      this.hazard = true;
      return this;
    }
    hide() {
      this.visible = false;
      this.hazard = false;
      return this;
    }
    tick() {
      if (this.popT > 0) {
        this.popT--;
        const k = this.popT / this.popDur;
        this.ox = this.popFrom[0] * k;
        this.oy = this.popFrom[1] * k;
      }
      if (this.spin) this.rot = (this.rot || 0) + this.spin;
    }
    hits(r) {
      if (!this.hazard) return false;
      return G.rectTri(r, G.spikeTri(this.x + this.ox, this.y + this.oy, this.w, this.h, this.dir, this.inset));
    }
    draw(ctx) {
      const img = G.SPR.spike(this.dir, this.w, this.pal);
      ctx.drawImage(img, Math.round(this.x + this.ox), Math.round(this.y + this.oy));
    }
  }

  // ---------------- セーブポイント ----------------
  class SavePoint extends Ent {
    constructor(W, tx, ty, o) {
      o = o || {};
      super(W, tx * T, ty * T, T, T);
      this.fake = !!o.fake;
      this.easy = !!o.easy;
      this.shootable = true;
      this.saveT = 0;
      this.layer = -0.5;
      this.wasIn = null; // 初回フレームは判定のみ（リスポーン直後に重なっていても保存しない）
      this.state = 'idle';
      const g = W.game;
      if (g && g.saveData && g.saveData.room === W.id && g.saveData.tx === tx && g.saveData.ty === ty) this.state = 'saved';
    }
    tick() {
      if (this.saveT > 0) this.saveT--;
      const P = this.W.player;
      const inside = P.alive && G.overlap(P, this);
      if (inside && this.wasIn === false) this.activate();
      this.wasIn = inside;
      if (this.state === 'die') this.dieT++;
    }
    onShot() {
      if (this.state !== 'die') this.activate();
      return true;
    }
    activate() {
      const W = this.W;
      if (this.fake) {
        if (this.state === 'die') return;
        this.state = 'die';
        this.dieT = 0;
        this.hazard = true;
        this.cause = this.cause || 'セーブポイントだと思った？';
        G.sfx('trap');
        return;
      }
      if (this.saveT > 0) return;
      this.saveT = 30;
      this.state = 'saved';
      for (const e of W.ents) if (e instanceof SavePoint && e !== this && e.state === 'saved') e.state = 'idle';
      if (W.game && W.game.save) W.game.save(W.id, this.x / T, this.y / T);
      if (this.onSave) this.onSave();
      G.sfx('save');
      W.burst(this.cx, this.cy, 14, ['#7dffb0', '#ffffff', '#ffe066'], 2, { g: 0, life: 24 });
      W.say('セーブしました', this.cx, this.y - 6, 50, { plain: true, size: 8, color: '#9affc0' });
    }
    hitbox() {
      return { x: this.x - 4, y: this.y - 4, w: this.w + 8, h: this.h + 8 };
    }
    draw(ctx) {
      G.Render.drawSave(ctx, this);
    }

  // ---------------- 反射鏡（弾の向きを変える） ----------------
  class Mirror extends Ent {
    constructor(W, tx, ty, type, o) {
      super(W, tx * T, ty * T, T, T);
      this.type = type; // '/', '\\', '|'
      this.shootable = true;
      this.layer = 1;
      this.glow = 0;
    }
    tick() {
      if (this.glow > 0) this.glow--;
    }
    onShot(b) {
      const vx = b.vx,
        vy = b.vy;
      const sp = Math.max(Math.abs(vx), Math.abs(vy));
      let nx = 0,
        ny = 0;
      if (this.type === '|') {
        nx = -vx;
        ny = -vy;
      } else if (this.type === '/') {
        // 右→上, 左→下, 上→右, 下→左
        if (vx > 0) ny = -sp;
        else if (vx < 0) ny = sp;
        else if (vy < 0) nx = sp;
        else nx = -sp;
      } else {
        if (vx > 0) ny = sp;
        else if (vx < 0) ny = -sp;
        else if (vy < 0) nx = -sp;
        else nx = sp;
      }
      b.vx = nx;
      b.vy = ny;
      b.x = this.cx + Math.sign(nx) * 11;
      b.y = this.cy + Math.sign(ny) * 11;
      b.hostile = true;
      b.life = 80;
      b.t = 0;
      this.glow = 10;
      G.sfx('ping');
      return false; // 弾は消えない
    }
    draw(ctx) {
      G.Render.drawMirror(ctx, this);
    }
  }

  // プレイヤーが近づいたら（条件付き）トゲが飛び出す
  WP.popSpike = function (tx, ty, dir, area, o) {
    const s = this.spike(tx, ty, dir, Object.assign({ hidden: true }, o));
    this.trig(area[0], area[1], area[2], area[3], () => s.pop(o && o.frames), { cond: o && o.cond });
    return s;
  };
})();

</script>
<script>
// ボス：デリシャス・キング（中ボス）と THE MOON（ラスボス）
(function () {
  'use strict';
  const G = globalThis.G;
  G.BOSSES = G.BOSSES || {};
  const SW = G.W,
    SH = G.H;

  class Boss extends G.Ent {
    constructor(W, x, y, w, h, o) {
      super(W, x, y, w, h);
      this.maxHp = this.hp = o.hp;
      this.name = o.name;
      this.shootable = true;
      this.hazard = false;
      this.vulnerable = false;
      this.showBar = false;
      this.hurtT = 0;
      this.defeated = false;
      this.layer = 3;
      this.ai = { alive: true };
      W.boss = this;
    }
    tick() {
      if (this.hurtT > 0) this.hurtT--;
    }
    onShot(b) {
      if (this.defeated) return false;
      if (!this.vulnerable) {
        this.W.spark(b.x, b.y, '#9aa0b0');
        G.sfx('hit');
        return true;
      }
      this.hp -= b.dmg || 1;
      this.hurtT = 4;
      G.sfx('bosshit');
      this.W.spark(b.x, b.y, '#ffffff');
      if (this.hp <= 0) {
        this.hp = 0;
        this.defeat();
      }
      return true;
    }
    defeat() {
      this.defeated = true;
      this.hazard = false;
      this.vulnerable = false;
      this.ai.alive = false;
      this.stop();
      if (this.onDefeat) this.onDefeat();
    }
  }
  G.Boss = Boss;

  // ------------------------------------------------------------------
  // デリシャス・キング
  // ------------------------------------------------------------------
  class King extends Boss {
    constructor(W, cx, cy) {
      super(W, cx - 26, cy - 26, 52, 52, { hp: 60, name: 'デリシャス・キング' });
      this.r = 26;
      this.scale = 0.25;
      this.cause = 'デリシャス・キングに押しつぶされた。';
      this.look = 0;
    }
    get rr() {
      return this.r * this.scale;
    }
    hits(rect) {
      return this.hazard && G.rectCircle(rect, this.cx, this.cy, this.rr - 3);
    }
    shotBox() {
      const r = this.rr;
      return { x: this.cx - r, y: this.cy - r, w: r * 2, h: r * 2 };
    }
    tick() {
      super.tick();
      this.look = G.approach(this.look, Math.sign(this.W.player.cx - this.cx), 0.2);
    }
    draw(ctx) {
      G.Render.drawKing(ctx, this);
    }
  }
  G.King = King;

  G.BOSSES.king = function (W, opts) {
    const FLOOR = 240;
    const k = W.add(new King(W, 240, FLOOR - 7));
    k.scale = 0.27;
    const rng = W.rng;
    const P = W.player;
    const setPos = (cx, cy) => {
      k.x = cx - 26;
      k.y = cy - 26;
    };
    const floorCy = () => FLOOR - 26;

    function* hop(tx) {
      const T = 50;
      k.vel((tx - k.cx) / T, -6.25, 0, 0.25);
      G.sfx('boing');
      yield () => k.vy > 0 && k.y + k.h >= FLOOR;
      k.stop();
      k.y = FLOOR - k.h;
      W.shake = 8;
      G.sfx('stomp');
      W.burst(k.cx, FLOOR, 12, ['#ff3355', '#c8102e'], 2, { up: 1.5, g: 0.15, life: 25 });
      for (const d of [-1, 1]) {
        const f = W.fruit(k.cx + d * 20, FLOOR - 6, { cause: '転がるリンゴにつまずいた。' });
        f.vel(d * (k.hp < k.maxHp / 2 ? 2.6 : 2.2), 0);
      }
    }
    function* bounce() {
      const n = k.hp < k.maxHp / 2 ? 4 : 3;
      for (let i = 0; i < n; i++) {
        const tx = G.clamp(P.cx + rng.range(-30, 30), 50, SW - 50);
        yield* hop(tx);
        yield 14;
      }
    }
    // 高い所を経由して移動する（プレイヤーの横をすり抜けて体当たりしないように）
    const HIGH = 50;
    function* travel(cx, cy, d) {
      d = d || 60;
      if (k.cy > HIGH + 30) {
        k.tweenTo(k.x, HIGH - 26, Math.round(d * 0.35), 'outQuad');
        yield Math.round(d * 0.35);
      }
      k.tweenTo(cx - 26, HIGH - 26, Math.round(d * 0.4), 'inOutQuad');
      yield Math.round(d * 0.4);
      if (cy !== HIGH) {
        k.tweenTo(cx - 26, cy - 26, Math.round(d * 0.3), 'inQuad');
        yield Math.round(d * 0.3);
      }
    }
    // プレイヤーから離れた位置に着地する
    function* land() {
      const tx = P.cx < SW / 2 ? SW - 90 : 90;
      k.tweenTo(tx - 26, k.y, 26, 'inOutQuad');
      yield 26;
      k.charging = true;
      yield 10;
      k.charging = false;
      k.tweenTo(k.x, FLOOR - 52, 22, 'inQuad');
      yield 22;
      W.shake = 6;
      G.sfx('stomp');
    }
    function* shower() {
      yield* travel(240, 60, 60);
      const n = k.hp < k.maxHp / 2 ? 16 : 11;
      for (let i = 0; i < n; i++) {
        const f = W.fruit(k.cx, k.cy + 10, { cause: 'リンゴの雨に打たれた。', splat: true });
        f.vel(rng.range(-2.6, 2.6), rng.range(-2.4, -0.8), 0, 0.12);
        f.maxV = 6;
        G.sfx('shoot');
        yield 9;
      }
      yield 20;
      yield* land();
    }
    function* charge() {
      const side = P.cx < SW / 2 ? 1 : -1; // プレイヤーと反対側へ
      const sx = side > 0 ? SW - 52 : 52;
      yield* travel(sx, FLOOR - 26, 64);
      k.charging = true;
      G.sfx('warn');
      W.say('！', 0, 0, 40, { follow: k, dy: -6, plain: true, size: 16, color: '#ff3a5a' });
      yield k.hp < k.maxHp / 2 ? 30 : 42;
      k.vel(-side * 6.2, 0);
      G.sfx('whoosh');
      yield () => (side > 0 ? k.cx < 52 : k.cx > SW - 52);
      k.stop();
      k.charging = false;
      W.shake = 10;
      G.sfx('stomp');
    }
    function* ring() {
      yield* travel(240, 100, 56);
      for (let w = 0; w < 2; w++) {
        k.inflate = 20;
        G.sfx('charge');
        yield 24;
        const n = 12,
          off = w * (Math.PI / 12);
        for (let i = 0; i < n; i++) {
          const a = off + (i / n) * Math.PI * 2;
          const f = W.fruit(k.cx, k.cy, { cause: 'リンゴの輪をくぐれなかった。' });
          f.vel(Math.cos(a) * 1.7, Math.sin(a) * 1.7);
        }
        G.sfx('explode');
        yield 46;
      }
      k.tweenTo(k.x, HIGH - 26, 20, 'outQuad');
      yield 20;
      yield* land();
    }

    W.run(function* () {
      // 登場演出：ただのリンゴが巨大化する
      const quick = opts.respawn && W.game && W.game.flags.kingSeen;
      yield () => P.cx < 330;
      W.closeGate && W.closeGate();
      G.music(null);
      if (!quick) {
        W.say('……', 0, 0, 60, { follow: k, dy: -4 });
        yield 70;
      }
      G.sfx('roar');
      W.shake = 40;
      for (let i = 0; i <= 30; i++) {
        k.scale = 0.27 + (i / 30) * 0.73;
        setPos(240, FLOOR - 26 * k.scale);
        yield 1;
      }
      setPos(240, floorCy());
      k.scale = 1;
      for (const e of W.ents) if (e instanceof G.Sign) e.alive = false;
      if (!quick) {
        W.say('われこそは デリシャス・キング！\nリンゴの恨み、思い知るがいい！', 0, 0, 120, { follow: k, dy: -6 });
        yield 110;
      }
      if (W.game) W.game.flags.kingSeen = true;
      G.music('boss');
      k.showBar = true;
      k.hazard = true;
      k.vulnerable = true;
      W.autoFire = true;
      if (W.easy) W.lives = 3;
      let last = '';
      for (;;) {
        const phase2 = k.hp < k.maxHp / 2;
        const pool = phase2 ? ['bounce', 'shower', 'charge', 'ring'] : ['bounce', 'shower', 'charge'];
        let p;
        do p = rng.pick(pool);
        while (p === last);
        last = p;
        if (p === 'bounce') yield* bounce();
        else if (p === 'shower') yield* shower();
        else if (p === 'charge') yield* charge();
        else yield* ring();
        yield phase2 ? 18 : 30;
      }
    }, k.ai);

    k.onDefeat = () => {
      G.music(null);
      W.autoFire = false;
      W.lives = null;
      W.invuln = 0;
      // 残っているリンゴを消す
      for (const e of W.ents) if (e instanceof G.Fruit) {
        W.burst(e.cx, e.cy, 6, ['#ff3355', '#ffd0d8'], 1.5, { g: 0.1 });
        e.alive = false;
      }
      W.run(function* () {
        for (let i = 0; i < 40; i++) {
          k.shakeX = (i % 2 ? 2 : -2);
          if (i % 6 === 0) {
            W.burst(k.cx + rng.range(-20, 20), k.cy + rng.range(-20, 20), 14, ['#ff3355', '#ffffff', '#ffd84a'], 2.5, { g: 0.05 });
            G.sfx('explode');
          }
          yield 2;
        }
        W.burst(k.cx, k.cy, 120, ['#ff3355', '#c8102e', '#ffd0d8', '#ffd84a'], 5, { g: 0.12, life: 60 });
        W.flash = 10;
        W.flashColor = '#ffffff';
        W.shake = 30;
        G.sfx('bigexplode');
        k.alive = false;
        k.visible = false;
        k.showBar = false;
        yield 50;
        G.sfx('fanfare');
        W.text(240, 90, 'デリシャス・キング をたおした！', { size: 15, color: '#ffe9a8' });
        if (W.game) W.game.flags.kingDead = true;
        yield 60;
        if (W.onBossCleared) W.onBossCleared();
      });
    };
    return k;
  };

  // ------------------------------------------------------------------
  // THE MOON（ラスボス）
  // ------------------------------------------------------------------
  class MoonBoss extends Boss {
    constructor(W, cx, cy, hp) {
      super(W, cx - 44, cy - 44, 88, 88, { hp, name: 'THE MOON' });
      this.r = 44;
      this.face = 'grin';
      this.cause = '月に触れてしまった。';
      this.shakeX = 0;
    }
    hits(rect) {
      return this.hazard && G.rectCircle(rect, this.cx, this.cy, this.r - 6);
    }
    // 弾の当たり判定は光の輪のぶん少し広い（足場の上から撃てるように）
    shotBox() {
      return { x: this.cx - this.r - 6, y: this.cy - this.r - 6, w: this.r * 2 + 12, h: this.r * 2 + 22 };
    }
    draw(ctx) {
      G.Render.drawMoonBoss(ctx, this);
    }
  }
  G.MoonBoss = MoonBoss;

  // 月落としの着弾予告（床の影）
  class Shadow extends G.Ent {
    constructor(W, x) {
      super(W, x, 236, 1, 1);
      this.layer = 2;
      this.lock = false;
    }
    draw(ctx) {
      const w = 40 + Math.sin(this.t * 0.3) * 4;
      ctx.fillStyle = this.lock ? (Math.floor(this.t / 3) % 2 ? 'rgba(255,40,80,0.7)' : 'rgba(255,40,80,0.35)') : 'rgba(10,0,30,0.5)';
      ctx.beginPath();
      ctx.ellipse(Math.round(this.x), 238, w, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      if (this.lock) G.SPR.tiny(ctx, '!', Math.round(this.x) - 1, 222, '#ff3a5a');
    }
  }

  G.BOSSES.moon = function (W, opts) {
    const FLOOR = 240;
    const HOMEY = 104;
    const P = W.player;
    const rng = W.rng;
    const m = W.add(new MoonBoss(W, 240, -90, 160));
    const phase = () => (m.hp > m.maxHp * 0.66 ? 1 : m.hp > m.maxHp * 0.33 ? 2 : 3);
    const deaths = (W.game && W.game.deaths) || 0;

    function* goTo(cx, cy, d, ease) {
      m.tweenTo(cx - m.r, cy - m.r, d, ease || 'inOutQuad');
      yield d;
    }
    function* drift() {
      const tx = G.clamp(P.cx + rng.range(-120, 120), 100, 380);
      yield* goTo(tx, HOMEY + rng.range(-6, 2), phase() === 3 ? 34 : 48);
    }
    function* crater() {
      const n = [3, 5, 7][phase() - 1];
      m.face = 'angry';
      G.sfx('charge');
      yield 26;
      const vol = phase() === 1 ? 1 : 2;
      for (let v = 0; v < vol; v++) {
        const a0 = Math.atan2(P.cy - m.cy, P.cx - m.cx);
        for (let i = 0; i < n; i++) {
          const a = a0 + (i - (n - 1) / 2) * 0.24;
          const r = W.fruit(m.cx + Math.cos(a) * 36, m.cy + Math.sin(a) * 36, { kind: 'rock', r: 6, cause: '月の石が直撃した。' });
          r.vel(Math.cos(a) * 2.5, Math.sin(a) * 2.5);
        }
        G.sfx('explode');
        yield 34;
      }
      m.face = 'grin';
      yield 16;
    }
    function* starRain() {
      const n = [8, 11, 14][phase() - 1];
      const xs = [];
      for (let i = 0; i < n; i++) xs.push(rng.range(28, 452));
      const marks = xs.map((x) => W.text(x, 30, '▼', { size: 9, color: '#fff27a' }));
      G.sfx('warn');
      m.face = 'calm';
      yield 40;
      marks.forEach((k) => (k.alive = false));
      for (let i = 0; i < n; i++) {
        const st = W.fruit(xs[i], -8, { kind: 'star', r: 6, cause: '星くずに打たれた。' });
        st.vel(0, 3.1);
        st.trail = true;
        if (i % 2) yield 5;
      }
      m.face = 'grin';
      yield 30;
    }
    function* moonDrop(count, stun) {
      m.face = 'grin';
      yield* goTo(m.cx, -150, 36, 'inQuad');
      for (let k = 0; k < count; k++) {
        const sh = W.add(new Shadow(W, P.cx));
        const follow = phase() === 3 ? 44 : 60;
        for (let i = 0; i < follow; i++) {
          sh.x = G.approach(sh.x, P.cx, 3.2);
          yield 1;
        }
        sh.lock = true;
        G.sfx('warn');
        yield phase() === 3 ? 20 : 26;
        m.x = sh.x - m.r;
        m.y = -110;
        m.face = 'rage';
        m.vel(0, 11);
        yield () => m.y + m.h >= FLOOR;
        m.stop();
        m.y = FLOOR - m.h;
        sh.alive = false;
        W.shake = 22;
        G.sfx('thud');
        G.sfx('stomp');
        W.burst(m.cx, FLOOR, 30, ['#c8c8d8', '#8a8a9e', '#fffbe0'], 3, { up: 2, g: 0.15, life: 30 });
        // 着地の一拍あとに衝撃波が左右へ走る
        const sp = phase() === 3 ? 3.0 : 2.4;
        W.after(12, () => {
          if (m.defeated) return;
          for (const d of [-1, 1]) {
            const wv = W.hbox(m.cx + d * (m.r - 16) - 6, FLOOR - 10, 12, 10, { kind: 'wave', cause: '衝撃波に足をすくわれた。' });
            wv.vel(d * sp, 0);
          }
          G.sfx('whoosh');
        });
        if (k < count - 1) {
          yield 22;
          yield* goTo(m.cx, -150, 26, 'inQuad');
        }
      }
      m.face = 'shock';
      yield stun || (phase() === 3 ? 60 : 80);
      m.face = 'grin';
      yield* goTo(G.clamp(m.cx, 100, 380), HOMEY, 46);
    }
    function* satellites() {
      yield* goTo(240, HOMEY, 30);
      const n = 8;
      const fr = [];
      for (let i = 0; i < n; i++) fr.push(W.fruit(m.cx, m.cy, { r: 7, keep: true, cause: 'リンゴ衛星に撃墜された。' }));
      G.sfx('charge');
      let ang = 0;
      const sp = phase() === 3 ? 0.045 : 0.034;
      for (let t = 0; t < 230; t++) {
        ang += sp;
        const rad = Math.min(t * 1.2, 66 + Math.sin(t * 0.035) * 34);
        for (let i = 0; i < n; i++) {
          const a = ang + (i / n) * Math.PI * 2;
          fr[i].x = m.cx + Math.cos(a) * rad - fr[i].r;
          fr[i].y = m.cy + Math.sin(a) * rad - fr[i].r;
        }
        yield 1;
      }
      for (let i = 0; i < n; i++) {
        const a = ang + (i / n) * Math.PI * 2;
        fr[i].vel(Math.cos(a) * 2.2, Math.sin(a) * 2.2);
        fr[i].offscreenKill = 60;
      }
      G.sfx('explode');
      yield 30;
    }
    function* lasers() {
      m.face = 'angry';
      const n = phase() === 3 ? 5 : 3;
      const xs = [P.cx];
      for (let i = 1; i < n; i++) xs.push(rng.range(30, 450));
      for (const x of xs) W.laser(Math.round(x) - 6, 0, 12, FLOOR, { warn: 46, dur: 22, cause: '月光線に焼かれた。' });
      G.sfx('charge');
      yield 74;
      if (phase() === 3) {
        // 足場の高さを薙ぎ払う
        W.laser(0, 146, 480, 12, { warn: 46, dur: 22, cause: '足場の上も安全ではない。' });
        G.sfx('charge');
        yield 74;
      }
      m.face = 'grin';
    }
    function* spiral() {
      yield* goTo(240, HOMEY - 10, 30);
      m.face = 'rage';
      G.sfx('roar');
      yield 30;
      let a = rng.range(0, 6.28);
      for (let t = 0; t < 170; t++) {
        if (t % 5 === 0) {
          for (let arm = 0; arm < 3; arm++) {
            const ang = a + (arm / 3) * Math.PI * 2;
            const st = W.fruit(m.cx + Math.cos(ang) * 30, m.cy + Math.sin(ang) * 30, { kind: 'star', r: 5, cause: '月の渦に巻き込まれた。' });
            st.vel(Math.cos(ang) * 1.9, Math.sin(ang) * 1.9);
          }
          if (t % 15 === 0) G.sfx('shoot');
        }
        a += 0.105;
        yield 1;
      }
      m.face = 'grin';
      yield 30;
    }
    function* desperation() {
      m.vulnerable = false;
      m.face = 'rage';
      W.shake = 40;
      G.sfx('roar');
      W.say('まだだ…まだ終わらんぞ！', 0, 0, 80, { follow: m, dy: -4 });
      yield 80;
      m.vulnerable = true;
      yield* moonDrop(3, 150);
    }

    W.run(function* () {
      const quick = opts.respawn && W.game && W.game.flags.moonSeen;
      yield quick ? 20 : 40;
      // 床の穴をふさぐ（プレイヤーが穴の中にいない時に）
      yield () => P.alive && P.onGround && P.y + P.h <= 240;
      W.sealFloor && W.sealFloor();
      G.music(null);
      m.face = 'calm';
      yield* goTo(240, HOMEY, quick ? 40 : 90, 'outQuad');
      if (!quick) {
        W.say('よくぞここまで来た、小さき者よ。', 0, 0, 100, { follow: m, dy: -4 });
        yield 100;
        W.say(`ここに来るまでに ${deaths} 回死んだようだな。`, 0, 0, 100, { follow: m, dy: -4 });
        yield 100;
        m.face = 'grin';
        W.say('その執念に敬意を表して――\n全力で叩き落としてくれよう！', 0, 0, 110, { follow: m, dy: -4 });
        yield 100;
      } else {
        m.face = 'grin';
        W.say(`また来たか。これで ${deaths} 回目の死だな。`, 0, 0, 70, { follow: m, dy: -4 });
        yield 60;
      }
      if (W.game) W.game.flags.moonSeen = true;
      G.sfx('roar');
      W.shake = 30;
      G.music('final');
      m.showBar = true;
      m.hazard = true;
      m.vulnerable = true;
      W.autoFire = true;
      if (W.easy) W.lives = 3;
      let lastPhase = 1,
        desp = false,
        last = '';
      for (;;) {
        const ph = phase();
        if (ph !== lastPhase) {
          lastPhase = ph;
          G.sfx('roar');
          W.shake = 24;
          W.flash = 8;
          W.flashColor = '#ffe9a8';
          W.say(ph === 2 ? 'なかなかやるな…！' : 'ならば本気を見せてやろう！', 0, 0, 70, { follow: m, dy: -4 });
          yield* goTo(240, HOMEY, 40);
          yield 20;
        }
        if (!desp && m.hp < m.maxHp * 0.1) {
          desp = true;
          yield* desperation();
          continue;
        }
        const pool = ph === 1 ? ['crater', 'star', 'drop'] : ph === 2 ? ['crater', 'star', 'drop', 'sat', 'laser'] : ['crater', 'sat', 'laser', 'spiral', 'drop'];
        let p;
        do p = rng.pick(pool);
        while (p === last);
        last = p;
        if (p === 'crater') yield* crater();
        else if (p === 'star') yield* starRain();
        else if (p === 'drop') yield* moonDrop(ph === 3 ? 2 : 1);
        else if (p === 'sat') yield* satellites();
        else if (p === 'laser') yield* lasers();
        else yield* spiral();
        yield* drift();
        yield ph === 1 ? 24 : 12;
      }
    }, m.ai);

    m.onDefeat = () => {
      G.music(null);
      W.autoFire = false;
      W.god = true;
      W.lives = null;
      W.invuln = 0;
      for (const e of W.ents) {
        if (e === m) continue;
        if (e instanceof G.Fruit || e instanceof G.Laser || e instanceof G.HazardBox || e instanceof Shadow) {
          W.spark(e.cx, e.cy, '#ffffff');
          e.alive = false;
        }
      }
      W.run(function* () {
        m.face = 'hurt';
        // 画面外で倒されても見えるように中央へ
        m.tweenTo(240 - m.r, 110 - m.r, 30, 'outQuad');
        yield 30;
        for (let i = 0; i < 100; i++) {
          m.shakeX = i % 2 ? 3 : -3;
          if (i % 8 === 0) {
            W.burst(m.cx + rng.range(-36, 36), m.cy + rng.range(-36, 36), 18, ['#fffbe0', '#efe6b0', '#ffffff', '#ffd84a'], 3, { g: 0.05 });
            G.sfx('explode');
          }
          yield 1;
        }
        W.flash = 24;
        W.flashColor = '#ffffff';
        W.shake = 50;
        G.sfx('bigexplode');
        W.burst(m.cx, m.cy, 220, ['#fffbe0', '#efe6b0', '#c9bd80', '#ffffff', '#ffd84a'], 6, { g: 0.08, life: 90 });
        m.alive = false;
        m.visible = false;
        m.showBar = false;
        // ここで倒したことを記録（最後のかけらで死んでも、戦い直しにはならない）
        if (W.game) {
          W.game.flags.moonDead = true;
          if (W.game.save) W.game.save(W.id, 2, 11);
        }
        W.god = !!G.god;
        yield 60;
        yield* aftermath(W);
      });
    };
    return m;
  };

  // 月を倒した後：喜んでいるところに最後のかけらが無言で降ってくる（リトライ後も同じ）
  function* aftermath(W) {
    const P = W.player;
    G.sfx('fanfare');
    W.text(240, 80, 'THE MOON をたおした！', { size: 16, color: '#ffe9a8' });
    W.text(240, 104, '空が、静かになった。', { size: 11, color: '#e8e2ff' });
    yield 100;
    const piece = W.fruit(P.cx, -14, { r: 7, keep: true, cause: '月の最後のかけら。勝って兜の緒を締めよ。' });
    piece.vel(0, 9, 0, 0.5);
    piece.maxV = 14;
    yield () => !P.alive || piece.y + piece.h >= 240;
    if (!P.alive) return;
    piece.y = 240 - piece.h;
    piece.hazard = false;
    piece.vel(P.cx < piece.cx ? 1.8 : -1.8, -4, 0, 0.22);
    piece.offscreenKill = 60;
    G.sfx('boing');
    W.say('ぽよん', piece.cx, 222, 50, { plain: true, size: 10, color: '#ffffff' });
    yield 50;
    W.say('……ちっ。', G.clamp(piece.cx, 40, 440), G.clamp(piece.cy - 14, 30, 220), 60, {});
    yield 80;
    if (W.game && W.game.stageClear) W.game.stageClear();
  }
  G.BOSSES.moonAftermath = aftermath;
})();

</script>
<script>
// 2面・3面のボス：サボテン将軍（2面中ボス） / THE SUN（2面ボス） / ブラックホール（3面中ボス） / ニュートンの樹（ラスボス）
(function () {
  'use strict';
  const G = globalThis.G;
  const SW = G.W;
  const FLOOR = 240;

  // 撃破後の共通処理：撃破を記録してセーブ（この後の演出で死んでも戦い直しにはならない）
  function markDead(W, flag, tx, ty) {
    if (!W.game) return;
    W.game.flags[flag] = true;
    if (W.game.save) W.game.save(W.id, tx, ty);
  }
  function clearShots(W, keep) {
    for (const e of W.ents) {
      if (e === keep || e instanceof G.Boss) continue;
      if (e instanceof G.Fruit || e instanceof G.Laser || e instanceof G.HazardBox || (e instanceof G.Spike && e.bossShot)) {
        W.spark(e.cx, e.cy, '#ffffff');
        e.alive = false;
      }
    }
  }
  G.BOSSES.markDead = markDead;
  G.BOSSES.clearShots = clearShots;

  // ------------------------------------------------------------------
  // サボテン将軍
  // ------------------------------------------------------------------
  class CactusBoss extends G.Boss {
    constructor(W, cx) {
      super(W, cx - 18, FLOOR - 76, 36, 76, { hp: 90, name: 'サボテン将軍' });
      this.scale = 0.3;
      this.cause = 'サボテン将軍にハグされた。';
      this.arm = 0; // 腕の上げ具合（-1 下 / 1 上）
      this.bloom = 0;
      this.tilt = 0;
    }
    // 見た目の高さは scale で変わる（足もとは this.y + this.h）
    hits(rect) {
      if (!this.hazard) return false;
      const h = this.h * this.scale,
        b = this.y + this.h;
      return G.overlap(rect, { x: this.x + 5, y: b - h + 4, w: this.w - 10, h: h - 4 });
    }
    shotBox() {
      const h = this.h * this.scale,
        b = this.y + this.h;
      return { x: this.x - 4, y: b - h - 6, w: this.w + 8, h: h + 6 };
    }
    draw(ctx) {
      G.Render.drawCactusBoss(ctx, this);
    }
  }
  G.CactusBoss = CactusBoss;

  G.BOSSES.cactus = function (W, opts) {
    const P = W.player;
    const rng = W.rng;
    const c = W.add(new CactusBoss(W, 380));
    const phase2 = () => c.hp < c.maxHp / 2;
    const needle = (x, y, vx, vy, ay, cause) => {
      const n = W.fruit(x, y, { kind: 'needle', r: 4, cause: cause || 'サボテンの針が刺さった。' });
      n.vel(vx, vy, 0, ay || 0);
      n.bossShot = true;
      n.maxV = 7;
      return n;
    };

    // 針の雨：上に撃ち上げた針が広がって降ってくる
    function* rain() {
      c.arm = 1;
      G.sfx('charge');
      yield 26;
      const n = phase2() ? 16 : 12;
      for (let w = 0; w < (phase2() ? 2 : 1); w++) {
        for (let i = 0; i < n; i++) {
          const vx = -2.8 + (5.6 * i) / (n - 1) + rng.range(-0.2, 0.2) + w * 0.18;
          needle(c.cx, c.y + 6, vx, -5.2 - rng.range(0, 1), 0.15, '針の雨に打たれた。');
        }
        G.sfx('explode');
        yield 26;
      }
      c.arm = 0;
      yield 60;
    }
    // 横一列の針：低い（跳ぶ）／高い（地面で待つ）を交互に
    function* volley() {
      const order = phase2() ? ['low', 'high', 'low', 'low'] : ['low', 'high', 'low'];
      for (const kind of order) {
        c.arm = kind === 'low' ? -1 : 1;
        G.sfx('warn');
        yield phase2() ? 22 : 28;
        const dir = P.cx < c.cx ? -1 : 1;
        const y = kind === 'low' ? FLOOR - 6 : FLOOR - 36;
        for (let k = 0; k < 3; k++) needle(c.cx + dir * (20 + k * 10), y, dir * 4.2, 0, 0, kind === 'low' ? '足もとの針を跳べなかった。' : '高い針に跳びこんだ。');
        // 反対側にも少し遅れて飛ばす
        W.after(10, () => {
          if (!c.defeated) for (let k = 0; k < 2; k++) needle(c.cx - dir * (20 + k * 10), y, -dir * 3.4, 0, 0, '背中側にも針は飛ぶ。');
        });
        G.sfx('shoot');
        yield 34;
      }
      c.arm = 0;
      yield 20;
    }
    // 床から順番にトゲが生える
    function* wave() {
      W.shake = 16;
      G.sfx('rumble');
      c.arm = -1;
      yield 30;
      const dir = P.cx < c.cx ? -1 : 1;
      const tx0 = Math.floor(c.cx / 20) + dir * 2;
      for (let tx = tx0; tx >= 1 && tx <= 22; tx += dir) {
        const s = W.spike(tx, 11, 'u', { hidden: true, cause: '地面から針が生えてきた。' });
        s.bossShot = true;
        s.pop(3, false);
        W.after(22, () => (s.alive = false));
        if (tx % 2 === 0) G.sfx('pop');
        yield phase2() ? 5 : 6;
      }
      c.arm = 0;
      yield 30;
    }
    // 反対側へ大ジャンプ。着地で衝撃波
    function* leap() {
      const tx = c.cx > SW / 2 ? rng.pick([90, 150]) : rng.pick([330, 390]);
      const dur = 56;
      c.vel((tx - c.cx) / dur, -5.6, 0, 0.2);
      c.arm = 1;
      G.sfx('boing');
      // 後半は空中から全方位に針をばらまく
      if (phase2()) {
        yield () => c.vy >= 0;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2 + rng.range(0, 0.4);
          needle(c.cx, c.y + 30, Math.cos(a) * 2.4, Math.sin(a) * 2.4, 0.04, '空からの針に刺さった。');
        }
        G.sfx('explode');
      }
      yield () => c.vy > 0 && c.y + c.h >= FLOOR;
      c.stop();
      c.y = FLOOR - c.h;
      c.arm = 0;
      W.shake = 14;
      G.sfx('stomp');
      W.burst(c.cx, FLOOR, 16, ['#d8a85a', '#f0c878'], 2, { up: 1.5, g: 0.15, life: 25 });
      W.after(10, () => {
        if (c.defeated) return;
        for (const d of [-1, 1]) {
          const wv = W.hbox(c.cx + d * 18 - 6, FLOOR - 10, 12, 10, { kind: 'wave', cause: '砂の衝撃波に足をすくわれた。' });
          wv.vel(d * 2.6, 0);
        }
      });
      yield 50;
    }
    // 頭の花が咲いて種をまき散らす（後半）
    function* bloom() {
      for (let w = 0; w < 3; w++) {
        c.bloom = 1;
        G.sfx('charge');
        yield 26;
        const n = 16,
          off = w * (Math.PI / 16) + rng.range(0, 0.3);
        for (let i = 0; i < n; i++) {
          const a = off + (i / n) * Math.PI * 2;
          const s = W.fruit(c.cx, c.y + 4, { kind: 'seed', r: 4, cause: 'サボテンの花に見とれた。' });
          s.vel(Math.cos(a) * 2, Math.sin(a) * 2);
          s.bossShot = true;
        }
        G.sfx('explode');
        c.bloom = 0;
        yield 44;
      }
    }

    // 針の竜巻：体から渦を巻いて針が飛び出す
    function* spin() {
      c.arm = 1;
      G.sfx('charge');
      yield 24;
      const arms = phase2() ? 3 : 2;
      let a = rng.range(0, 6.28);
      for (let t = 0; t < 130; t++) {
        if (t % 6 === 0) {
          for (let k = 0; k < arms; k++) {
            const ang = a + (k / arms) * Math.PI * 2;
            needle(c.cx, c.y + 30, Math.cos(ang) * 2, Math.sin(ang) * 2, 0, '針の竜巻に巻きこまれた。');
          }
          if (t % 18 === 0) G.sfx('shoot');
        }
        a += 0.08;
        yield 1;
      }
      c.arm = 0;
      yield 30;
    }

    W.run(function* () {
      const quick = opts.respawn && W.game && W.game.flags.cactusSeen;
      yield () => P.cx > 150 && P.onGround;
      W.closeGate && W.closeGate();
      G.music(null);
      if (!quick) {
        W.say('……', 0, 0, 50, { follow: c, dy: -4 });
        yield 60;
      }
      G.sfx('roar');
      W.shake = 36;
      for (let i = 0; i <= 30; i++) {
        c.scale = 0.3 + (i / 30) * 0.7;
        yield 1;
      }
      for (const e of W.ents) if (e instanceof G.Sign) e.alive = false;
      if (!quick) {
        W.say('われこそは サボテン将軍！\n月の仇、とらせてもらう！', 0, 0, 110, { follow: c, dy: -8 });
        yield 100;
      }
      if (W.game) W.game.flags.cactusSeen = true;
      G.music('boss');
      c.showBar = true;
      c.hazard = true;
      c.vulnerable = true;
      W.autoFire = true;
      if (W.easy) W.lives = 3;
      let last = '';
      for (;;) {
        const pool = phase2() ? ['rain', 'volley', 'wave', 'leap', 'bloom', 'spin'] : ['rain', 'volley', 'wave', 'leap', 'spin'];
        let p;
        do p = rng.pick(pool);
        while (p === last);
        last = p;
        if (p === 'spin') yield* spin();
        else if (p === 'rain') yield* rain();
        else if (p === 'volley') yield* volley();
        else if (p === 'wave') yield* wave();
        else if (p === 'leap') yield* leap();
        else yield* bloom();
        yield phase2() ? 10 : 18;
      }
    }, c.ai);

    c.onDefeat = () => {
      G.music(null);
      W.autoFire = false;
      W.lives = null;
      W.invuln = 0;
      clearShots(W, c);
      markDead(W, 'cactusDead', 2, 11);
      W.run(function* () {
        for (let i = 0; i < 40; i++) {
          c.shakeX = i % 2 ? 2 : -2;
          if (i % 8 === 0) {
            W.burst(c.cx + rng.range(-14, 14), c.y + rng.range(10, 60), 12, ['#4aa040', '#8ae060', '#ffffff'], 2, { g: 0.05 });
            G.sfx('explode');
          }
          yield 2;
        }
        c.shakeX = 0;
        c.showBar = false;
        // プレイヤーのいる方へ倒れてくる
        const dir = P.cx < c.cx ? -1 : 1;
        W.say('む、無念……', 0, 0, 50, { follow: c, dy: -8 });
        yield 40;
        for (let i = 1; i <= 12; i++) {
          c.tilt = (dir * i) / 12;
          yield 1;
        }
        const x0 = dir > 0 ? c.cx : c.cx - 80;
        const hb = W.hbox(x0, FLOOR - 22, 80, 22, { kind: 'fallen', cause: 'サボテン将軍が倒れてきた。' });
        hb.visible = false;
        hb.life = 24;
        W.shake = 18;
        G.sfx('stomp');
        W.burst(c.cx + dir * 40, FLOOR - 6, 30, ['#d8a85a', '#f0c878', '#4aa040'], 2.5, { up: 2, g: 0.15, life: 30 });
        yield 30;
        W.burst(c.cx + dir * 30, FLOOR - 16, 80, ['#4aa040', '#8ae060', '#ffe9a8'], 4, { g: 0.1, life: 50 });
        G.sfx('bigexplode');
        c.alive = false;
        c.visible = false;
        yield 40;
        G.sfx('fanfare');
        W.text(240, 90, 'サボテン将軍 をたおした！', { size: 15, color: '#ffe9a8' });
        yield 60;
        if (W.onBossCleared) W.onBossCleared();
      });
    };
    return c;
  };

  // ------------------------------------------------------------------
  // THE SUN
  // ------------------------------------------------------------------
  class SunBoss extends G.Boss {
    constructor(W, cx, cy) {
      super(W, cx - 38, cy - 38, 76, 76, { hp: 200, name: 'THE SUN' });
      this.r = 38;
      this.face = 'grin';
      this.cause = '太陽に触れてしまった。熱い。';
      this.dark = false;
      this.spin = 0;
    }
    hits(rect) {
      return this.hazard && G.rectCircle(rect, this.cx, this.cy, this.r - 6);
    }
    shotBox() {
      return { x: this.cx - this.r - 6, y: this.cy - this.r - 6, w: this.r * 2 + 12, h: this.r * 2 + 24 };
    }
    tick() {
      super.tick();
      this.spin += this.dark ? 0.005 : 0.02;
    }
    draw(ctx) {
      G.Render.drawSunBoss(ctx, this);
    }
  }
  G.SunBoss = SunBoss;

  G.BOSSES.sun = function (W, opts) {
    const P = W.player;
    const rng = W.rng;
    const HOMEY = 106; // 足場の上から撃った弾が届く高さ
    const s = W.add(new SunBoss(W, 240, -80));
    const phase = () => (s.hp > s.maxHp * 0.66 ? 1 : s.hp > s.maxHp * 0.33 ? 2 : 3);
    const deaths = (W.game && W.game.deaths) || 0;
    // 太陽の弾はすべて遅め（軌道は同じまま速さだけ落とす：速度×SLOW、加速度×SLOW²）
    const SLOW = 0.7;
    const fire = (x, y, r, cause) => {
      const f = W.fruit(x, y, { kind: 'fire', r, cause });
      f.bossShot = true;
      f.vel = function (vx, vy, ax, ay) {
        return G.Ent.prototype.vel.call(this, (vx || 0) * SLOW, (vy || 0) * SLOW, (ax || 0) * SLOW * SLOW, (ay || 0) * SLOW * SLOW);
      };
      return f;
    };
    function* goTo(cx, cy, d, ease) {
      s.tweenTo(cx - s.r, cy - s.r, d, ease || 'inOutQuad');
      yield d;
    }
    function* drift() {
      yield* goTo(G.clamp(P.cx + rng.range(-120, 120), 90, 390), HOMEY + rng.range(-8, 4), phase() === 3 ? 34 : 46);
    }
    // フレア：放物線の火球が床で弾ける
    function* flare() {
      s.face = 'angry';
      G.sfx('charge');
      yield 24;
      const n = [2, 3, 3][phase() - 1];
      for (let i = 0; i < n; i++) {
        const tx = G.clamp(P.cx + (i - (n - 1) / 2) * 60 + rng.range(-12, 12), 20, 460);
        const T = 48;
        const f = fire(s.cx, s.cy + 20, 9, 'フレアの直撃を受けた。');
        const g = 0.16;
        f.vel((tx - s.cx) / T, (FLOOR - 8 - (s.cy + 20) - 0.5 * g * T * T) / T, 0, g);
        f.tick = function () {
          if (this.vy > 0 && this.cy >= FLOOR - 8) {
            this.alive = false;
            G.sfx('explode');
            W.burst(this.cx, FLOOR, 10, ['#ff7a20', '#ffd84a'], 2, { up: 1.5, g: 0.15, life: 20 });
            for (let k = 0; k < 4; k++) {
              const a = -Math.PI * (0.12 + (0.76 * k) / 3);
              const b = fire(this.cx, FLOOR - 10, 4, '弾けたフレアに焼かれた。');
              b.vel(Math.cos(a) * 2.1, Math.sin(a) * 2.6, 0, 0.12);
            }
          }
        };
        G.sfx('shoot');
        yield 16;
      }
      s.face = 'grin';
      yield 60;
    }
    // 光線：細い予告線の場所に太い光が落ちる
    function* beam() {
      s.face = 'angry';
      const n = phase() === 1 ? 2 : phase() === 2 ? 3 : 4;
      const xs = [P.cx];
      for (let i = 1; i < n; i++) xs.push(rng.range(30, 450));
      for (const x of xs) W.laser(Math.round(x) - 7, 0, 14, FLOOR, { warn: 44, dur: 22, cause: '日光に焼かれた。', color: '#ffb030' });
      G.sfx('charge');
      yield 72;
      if (phase() === 3) {
        W.laser(0, 146, 480, 12, { warn: 44, dur: 22, cause: '足場の高さを焼き払われた。', color: '#ffb030' });
        G.sfx('charge');
        yield 72;
      }
      s.face = 'grin';
    }
    // コロナ：火の輪が広がる（輪ごとに隙間の位置がずれる）
    function* corona() {
      yield* goTo(240, HOMEY, 30);
      const rings = phase() === 3 ? 3 : 2;
      for (let w = 0; w < rings; w++) {
        s.face = 'rage';
        G.sfx('charge');
        yield 20;
        const n = 12,
          off = (w % 2) * (Math.PI / n);
        for (let i = 0; i < n; i++) {
          const a = off + (i / n) * Math.PI * 2;
          const f = fire(s.cx + Math.cos(a) * 30, s.cy + Math.sin(a) * 30, 5, 'コロナの輪をくぐれなかった。');
          f.vel(Math.cos(a) * 1.7, Math.sin(a) * 1.7);
        }
        G.sfx('explode');
        yield 34;
      }
      s.face = 'grin';
      yield 30;
    }
    // 太陽の渦：何本もの腕が回転しながら火の玉をまき散らす
    function* spiral() {
      yield* goTo(240, HOMEY - 6, 30);
      s.face = 'rage';
      G.sfx('roar');
      yield 26;
      const arms = phase() === 3 ? 3 : 2;
      const dirSpin = rng.chance(0.5) ? 1 : -1;
      let a = rng.range(0, 6.28);
      for (let t = 0; t < 160; t++) {
        if (t % 9 === 0) {
          for (let k = 0; k < arms; k++) {
            const ang = a + (k / arms) * Math.PI * 2;
            const f = fire(s.cx + Math.cos(ang) * 30, s.cy + Math.sin(ang) * 30, 4, '太陽の渦に巻きこまれた。');
            f.vel(Math.cos(ang) * 1.8, Math.sin(ang) * 1.8);
          }
          if (t % 18 === 0) G.sfx('shoot');
        }
        a += 0.075 * dirSpin;
        yield 1;
      }
      s.face = 'grin';
      yield 30;
    }
    // 太陽風：こちらを狙った扇状の火の玉を連射
    function* wind() {
      s.face = 'angry';
      G.sfx('charge');
      yield 20;
      const volleys = phase() === 3 ? 4 : 3;
      for (let v = 0; v < volleys; v++) {
        const a0 = Math.atan2(P.cy - s.cy, P.cx - s.cx);
        const n = v % 2 ? 4 : 5;
        for (let i = 0; i < n; i++) {
          const a = a0 + (i - (n - 1) / 2) * 0.2;
          const f = fire(s.cx + Math.cos(a) * 34, s.cy + Math.sin(a) * 34, 4, '太陽風に吹き飛ばされた。');
          f.vel(Math.cos(a) * 2.6, Math.sin(a) * 2.6);
        }
        G.sfx('shoot');
        yield 20;
      }
      s.face = 'grin';
      yield 30;
    }
    // 熱波：床にマグマがせり上がる。足場の上で狙い撃ちをかわす
    function* heat() {
      yield* goTo(240, 60, 30);
      W.say('ほら、熱くなってきただろう？', 0, 0, 70, { follow: s, dy: -4 });
      G.sfx('rumble');
      W.shake = 20;
      const lava = W.lava(300, { speed: 0, cause: '床が焼けていた。', minY: 0 });
      lava.bossShot = true;
      for (let i = 0; i < 80; i++) {
        lava.y = 300 - (i / 80) * 88; // 212 まで
        yield 1;
      }
      for (let k = 0; k < (phase() === 3 ? 3 : 3); k++) {
        yield 26;

      s.face = 'calm';
      yield* goTo(240, HOMEY, quick ? 40 : 90, 'outQuad');
      if (!quick) {
        W.say('よくも月を消してくれたな。', 0, 0, 90, { follow: s, dy: -4 });
        yield 90;
        W.say(`${deaths} 回も死んでまだ懲りないか。`, 0, 0, 90, { follow: s, dy: -4 });
        yield 90;

        W.say('この太陽が、焼きつくしてくれる！', 0, 0, 90, { follow: s, dy: -4 });
        yield 80;
      } else {
        s.face = 'grin';
        W.say(`おかえり。${deaths} 回目だな。`, 0, 0, 60, { follow: s, dy: -4 });
        yield 50;
      }
      if (W.game) W.game.flags.sunSeen = true;
      G.sfx('roar');
      W.shake = 30;
      G.music('final');
      s.showBar = true;
      s.hazard = true;
      s.vulnerable = true;
      W.autoFire = true;

      let lastPhase = 1,
        desp = false,
        last = '';
      for (;;) {

          lastPhase = ph;
          G.sfx('roar');
          W.shake = 24;
          W.flash = 8;
          W.flashColor = '#ffd84a';

        const pool = ph === 1 ? ['flare', 'beam', 'corona', 'spiral'] : ph === 2 ? ['flare', 'beam', 'corona', 'heat', 'spiral', 'wind'] : ['flare', 'beam', 'corona', 'heat', 'eclipse', 'spiral', 'wind'];
        let p;

        yield 120;

  class BlackHole extends G.Boss {
    constructor(W, cx, cy) {
      super(W, cx - 22, cy - 22, 44, 44, { hp: 140, name: 'ブラックホール' });
      this.r = 22;
      this.size = 0.15;
      this.spin = 0;
      this.cause = '吸い込まれた。スパゲッティになった。';
    }
    hits(rect) {
      return this.hazard && G.rectCircle(rect, this.cx, this.cy, this.r * this.size - 4);
    }
    shotBox() {
      const r = this.r * this.size + 6;
      return { x: this.cx - r, y: this.cy - r, w: r * 2, h: r * 2 };
    }
    tick() {
      super.tick();
      this.spin += 0.05;
      // 弾も吸い寄せられて曲がる
      if (this.vulnerable)
        for (const b of this.W.bullets) {
          if (b.hostile) continue;
          const dx = this.cx - b.x,
            dy = this.cy - b.y;
          const d = Math.hypot(dx, dy) || 1;
          // 近いほど強く曲がる（周回せずに吸いこまれる）
          const k = 0.45 + 40 / d;
          b.vx += (dx / d) * k;
          b.vy += (dy / d) * k;
          const v = Math.hypot(b.vx, b.vy) || 1;
          b.vx *= 6 / v;
          b.vy *= 6 / v;
          // 後ろ向きに撃った弾もしばらくは戻ってこられるように（ただし永遠には回らない）
          b.bhT = (b.bhT || 0) + 1;
          if (b.bhT < 90) b.life = Math.max(b.life, 8);
        }
    }
    draw(ctx) {
      G.Render.drawBlackHole(ctx, this);
    }
  }

  G.BOSSES.blackhole = function (W, opts) {
    const P = W.player;
    const rng = W.rng;
    const h = W.add(new BlackHole(W, 240, 120));
    let pullBase = 0;
    const phase2 = () => h.hp < h.maxHp / 2;
    W.windAir = false;
    W.onStep = () => {
      // 中心からの距離が近いほど強く吸い寄せる
      if (!pullBase || !P.alive) {

        return;
      }
      const dx = h.cx - P.cx;
      const d = Math.max(30, Math.hypot(dx, h.cy - P.cy));
      W.windX = Math.sign(dx) * pullBase * G.clamp(140 / d, 0.5, 1.6);
    };
    const debris = (x, y, vx, vy, kind, cause) => {
      const f = W.fruit(x, y, { kind: kind || 'rock', r: 5, cause: cause || '宇宙のゴミが当たった。' });
      f.vel(vx, vy);
      f.bossShot = true;

    };
    // 渦を巻いて飛び出すゴミ
    function* spiral() {
      G.sfx('charge');
      yield 20;
      let a = rng.range(0, 6.28);
      const arms = phase2() ? 4 : 3;
      for (let t = 0; t < 150; t++) {
        if (t % 6 === 0) {
          for (let k = 0; k < arms; k++) {
            const ang = a + (k / arms) * Math.PI * 2;
            debris(h.cx + Math.cos(ang) * 16, h.cy + Math.sin(ang) * 16, Math.cos(ang) * 1.6, Math.sin(ang) * 1.6);
